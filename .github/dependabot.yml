# Weekly dependency updates, grouped so each ecosystem opens one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
    groups: { cargo: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
    groups: { npm: { update-types: [minor, patch] } }
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
