# Keep PR titles conventional for readable history and optional squash merges. Rebase merges
# preserve the individual Conventional Commits that release-please reads on main.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          types: |
            feat
            fix
            perf
            security
            docs
            deps
            refactor
            test
            ci
            chore
