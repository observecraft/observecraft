# Each job runs only when its files change (docs-only changes run nothing); a change to the workflows runs everything.
# Branch rules require the `ci-ok` job, which passes when every job that ran passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.f.outputs.server }}
      web: ${{ steps.f.outputs.web }}
      licenses: ${{ steps.f.outputs.licenses }}
      configs: ${{ steps.f.outputs.configs }}
      charts: ${{ steps.f.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/**
            server:
              - *ci
              - server/**
              - web/src/api/generated/**
            web:
              - *ci
              - web/**
            licenses:
              - *ci
              - server/Cargo.toml
              - server/Cargo.lock
              - server/crates/*/Cargo.toml
              - server/deny.toml
              - web/package.json
              - web/package-lock.json
            configs:
              - *ci
              - deploy/otel/**
              - deploy/vector/**
            charts:
              - *ci
              - deploy/helm/**
              - server/**
              - web/**

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libxml2-dev libxmlsec1-dev
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: server }
      - run: cargo test --workspace
        working-directory: server
      - run: cargo clippy --workspace
        working-directory: server
      - name: OpenAPI document is up to date (run `make openapi`)
        run: cargo run -q --bin observecraft-server -- openapi > ../web/src/api/generated/openapi.json && git diff --exit-code
        working-directory: server

  # Dependencies must be permissive (ObserveCraft is MIT): server/deny.toml, and the allowlist below for the web app.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { manifest-path: server/Cargo.toml, command: check licenses bans sources }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20.18.0, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --summary \
            --onlyAllow 'MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;OFL-1.1;MPL-2.0;Zlib'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20.18.0, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npx tsc -p . && npm run build
        working-directory: web

  pipeline-configs:
    needs: changes
    if: needs.changes.outputs.configs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collector config
        run: >-
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=y -e OC_HOST_NAME=h -e OC_HOST_ORG=default
          -v $PWD/deploy/otel:/c:ro otel/opentelemetry-collector-contrib:0.112.0
          validate --config=/c/collector.yaml --config=/c/hostmetrics.yaml
      - name: Vector config and VRL tests
        run: >-
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=y -e OC_LOGPROC_URL=http://x
          -v $PWD/deploy/vector:/etc/vector:ro timberio/vector:0.42.0-debian
          test /etc/vector/aggregator.yaml /etc/vector/tests.yaml

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.16.4 }
      - name: Lint
        run: |
          helm lint deploy/helm/observecraft
          helm lint deploy/helm/observecraft -f deploy/helm/observecraft/values-ha.yaml
          helm lint deploy/helm/observecraft-agent -f deploy/helm/observecraft-agent/ci/default-values.yaml
      - name: Artifact Hub annotations
        run: |
          for chart in observecraft observecraft-agent; do
            python3 deploy/helm/artifacthub-annotate.py "deploy/helm/$chart" "$(awk '/^version:/ {print $2}' deploy/helm/$chart/Chart.yaml)"
            helm lint "deploy/helm/$chart" -f "deploy/helm/$chart/ci/default-values.yaml"
          done
      - name: Build the image for the cluster
        run: docker build -f server/Dockerfile -t ghcr.io/observecraft/observecraft:ci .
      # Fails on critical vulnerabilities that already have a fix (base image or dependency upgrade).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "ghcr.io/observecraft/observecraft:ci", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { cluster_name: ci }
      - name: Install and test
        run: |
          kind load docker-image ghcr.io/observecraft/observecraft:ci --name ci
          helm install observecraft deploy/helm/observecraft -n observecraft --create-namespace \
            -f deploy/helm/observecraft/ci/default-values.yaml --set image.tag=ci --wait --timeout 10m
          helm test observecraft -n observecraft --logs
          helm install observecraft-agent deploy/helm/observecraft-agent -n observecraft \
            -f deploy/helm/observecraft-agent/ci/default-values.yaml --wait --timeout 5m

  ci-ok:
    if: always()
    needs: [changes, server, licenses, web, pipeline-configs, charts]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job that ran passed
        run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
