# Keep ci-ok present even for docs-only PRs; filter jobs rather than the workflow.
# Branch rules require the `ci-ok` job, which passes when every job that ran passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# DuckDB compiles native C++ too: debug symbols make CI builds and caches much larger.
# Tests and clippy do not need debugger symbols; production images use the release profile.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.f.outputs.server }}
      web: ${{ steps.f.outputs.web }}
      browser: ${{ steps.f.outputs.browser }}
      licenses: ${{ steps.f.outputs.licenses }}
      configs: ${{ steps.f.outputs.configs }}
      charts: ${{ steps.f.outputs.charts }}
      smoke: ${{ steps.f.outputs.smoke }}
      tf_compat: ${{ steps.f.outputs.tf_compat }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            server:
              - *ci
              - server/**
              - web/src/api/generated/**
              # tf-compat runs the server job's build.
              - Makefile
              - scripts/datadog-fixtures/**
              - scripts/tf-compat/**
            web:
              - *ci
              - web/**
              - scripts/**
              - server/seeds/**
              - CHANGELOG.md
            browser:
              - *ci
              - browser/**
            licenses:
              - *ci
              - browser/package.json
              - browser/package-lock.json
              - server/Cargo.toml
              - server/Cargo.lock
              - server/crates/*/Cargo.toml
              - server/deny.toml
              - web/package.json
              - web/package-lock.json
            configs:
              - *ci
              - deploy/otel/**
              - deploy/vector/**
            charts:
              - *ci
              - deploy/helm/**
              - scripts/helm-chart.test.mjs
              - deploy/otel/**
              - deploy/vector/**
            # Application changes have Rust/web checks and the exact image is tested on main.
            # Exercise Docker/kind on PRs when packaging or deployment itself changes.
            smoke:
              - *ci
              - server/Dockerfile
              - .dockerignore
              - deploy/helm/**
              - deploy/otel/**
              - deploy/vector/**
            tf_compat:
              - *ci
              - server/crates/oc-api/src/routes/datadog_api/**
              - server/crates/oc-api/src/auth/**
              - server/crates/oc-api/src/state.rs
              - server/crates/oc-api/src/main.rs
              - server/crates/oc-api/src/config.rs
              - server/crates/oc-api/src/routes/mod.rs
              - server/crates/oc-api/Cargo.toml
              - server/crates/oc-store/**
              - server/migrations/**
              - server/Cargo.toml
              - server/Cargo.lock
              - Makefile
              - scripts/datadog-fixtures/**
              - scripts/tf-compat/**

  server:
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.37.168@sha256:a56702852d7c8055a021a42a3a60f49daa49e9204a949ea033e51bb327948648 # the version the platform runs
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: [8123:8123]
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OC_TEST_CLICKHOUSE_URL: http://localhost:8123
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ubuntu's mirror can take minutes for libclang alone: the downloaded packages are cached (refreshed weekly), and the
      # package lists only refreshed when the runner image's are stale.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}
      - name: Install build dependencies
        run: |
          packages=(pkg-config libclang-dev libxml2-dev libxmlsec1-dev)
          install() { sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" "${packages[@]}"; }
          mkdir -p ~/apt-archives/partial
          install || { sudo apt-get update && install; }
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with: { components: clippy }
      # Saved from main only, so pull requests (dependency bumps above all) don't add their targets to the cache every
      # job restores.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: server, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # libduckdb-sys unpacks its sources once into target/duckdb-sources/<hash> and marks them .complete. A cached copy
      # without the marker makes its build script fail ("Directory not empty") whenever it reruns (a new feature).
      - name: Drop incomplete DuckDB sources restored from the cache
        run: shopt -s nullglob; for d in server/target/duckdb-sources/*/; do [ -f "$d.complete" ] || rm -rf "$d"; done
      # The integration pipelines' upstream log samples are fetched at test time, not vendored:
      # scripts/integration-log-samples/fetch.sh pins the revisions and their archives' SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/observecraft/integration-log-samples
          key: integration-log-samples-${{ hashFiles('scripts/integration-log-samples/fetch.sh') }}
      - name: Fetch integration log samples
        run: make integration-log-samples
      # A runner that runs out of disk or memory dies without a log ("The hosted runner lost communication with the
      # server"): what it had before building.
      - name: Disk and memory
        run: df -h / && free -h
      - run: cargo test --locked --workspace
        working-directory: server
        env:
          OC_REQUIRE_LOG_SAMPLES: "1"
      - run: cargo clippy --locked --workspace --all-targets
        working-directory: server
      - name: OpenAPI document is up to date (run `make openapi`)
        run: cargo run --locked -q --bin observecraft-server -- openapi > ../web/src/api/generated/openapi.json && git diff --exit-code
        working-directory: server
      # tf-compat runs the server and its Datadog API tests from this build instead of compiling them again.
      - name: Keep the server and its tests for tf-compat
        if: needs.changes.outputs.tf_compat == 'true'
        working-directory: server
        run: |
          mkdir -p ../server-build
          cp target/debug/observecraft-server ../server-build/
          # The workspace's build, as tested above (`-p oc-api` alone unifies features differently and recompiles).
          cargo test --locked --workspace --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test and .target.name == "observecraft-server" and (.target.kind | index("bin"))) | .executable' \
            | xargs -I{} cp {} ../server-build/observecraft-server-tests
          ls -la ../server-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.tf_compat == 'true'
        with: { name: server-build, path: server-build/, retention-days: 1, if-no-files-found: error }

  # The Datadog-compatible management API (docs/adr/0003): Datadog's recorded API scenarios replayed
  # against the server, then Datadog's Terraform provider run by OpenTofu against a local server.
  tf-compat:
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.37.168@sha256:a56702852d7c8055a021a42a3a60f49daa49e9204a949ea033e51bb327948648 # the version the platform runs
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: [8123:8123]
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: observecraft
          POSTGRES_PASSWORD: observecraft
          POSTGRES_DB: observecraft
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U observecraft"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.11-alpine
        ports: [6379:6379]
    env:
      OC_TEST_CLICKHOUSE_URL: http://localhost:8123
      OC_TEST_POSTGRES_URL: postgres://observecraft:observecraft@localhost:5432/observecraft
      OC_CLICKHOUSE_URL: http://localhost:8123
      OC_CLICKHOUSE_USER: default
      OC_CLICKHOUSE_PASSWORD: ""
      OC_POSTGRES_URL: postgres://observecraft:observecraft@localhost:5432/observecraft
      OC_CACHE_URL: redis://localhost:6379/0
    # Runs the server job's build (the server and its unit tests) rather than compiling oc-api again.
    needs: [changes, server]
    if: needs.changes.outputs.tf_compat == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The server's shared libraries and psql; package lists are refreshed only when the image's are stale.
      - name: Install runtime dependencies
        run: |
          packages=(libxml2 libxmlsec1t64 libxmlsec1t64-openssl postgresql-client)
          sudo apt-get install -y --no-install-recommends "${packages[@]}" || { sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: server-build, path: server-build }
      - name: The build's shared libraries are all installed
        run: chmod +x server-build/* && ! ldd server-build/* | grep "not found"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/observecraft/tf-compat
          key: tf-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tf-compat/run.sh', 'scripts/tf-compat/fixtures/**') }}
      # Datadog's recordings are fetched at test time, not vendored: scripts/datadog-fixtures/fetch.sh pins
      # the datadog-api-client-go commit and its archive's SHA-256; the cache is keyed on that commit and on
      # the script (its feature list).
      - id: dd-fixtures
        run: echo "commit=$(sed -n 's/^COMMIT=//p' scripts/datadog-fixtures/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/observecraft/datadog-api-client-go/${{ steps.dd-fixtures.outputs.commit }}
          key: datadog-api-client-go-${{ steps.dd-fixtures.outputs.commit }}-${{ hashFiles('scripts/datadog-fixtures/fetch.sh') }}
      - name: Fetch Datadog API contract fixtures
        run: make datadog-fixtures
      # `cargo test -p oc-api datadog_api`, run from the crate's directory as cargo does.
      - name: Datadog API contract fixtures
        run: ../../../server-build/observecraft-server-tests datadog_api
        working-directory: server/crates/oc-api
        env:
          OC_REQUIRE_DATADOG_FIXTURES: "1"
      - name: Datadog Terraform provider against a local server
        run: make tf-compat TF_COMPAT_ARGS=--local
        env:
          OC_TF_SERVER_BIN: ${{ github.workspace }}/server-build/observecraft-server

  # Dependencies must be permissive (ObserveCraft is MIT): server/deny.toml, and the allowlist below for the web app.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { manifest-path: server/Cargo.toml, command: check licenses bans sources }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --summary \
            --onlyAllow 'MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;OFL-1.1;MPL-2.0;Zlib'
      - name: oc-browser dependencies
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --summary \
            --onlyAllow 'MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;OFL-1.1;MPL-2.0;Zlib'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: web

  # oc-browser (browser tests, AI Testing): its tests run steps in Playwright's Chromium.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: browser/package-lock.json }
      - run: npm ci && npx playwright-core install --with-deps chromium && npm run typecheck && npm test
        working-directory: browser
      - name: Image
        run: docker build -t oc-browser:ci browser

  pipeline-configs:
    needs: changes
    if: needs.changes.outputs.configs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collector config
        run: >-
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=y -e OC_HOST_NAME=h -e OC_HOST_ORG=default
          -v "$PWD/deploy/otel:/c:ro" otel/opentelemetry-collector-contrib:0.163.2
          validate --config=/c/collector.yaml --config=/c/hostmetrics.yaml
      - name: Vector config and VRL tests
        run: >-
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=y -e OC_LOGPROC_URL=http://x
          -v "$PWD/deploy/vector:/etc/vector:ro" timberio/vector:0.42.0-debian
          test /etc/vector/aggregator.yaml /etc/vector/tests.yaml

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with: { version: v3.16.4 }
      - name: Lint
        run: |
          helm lint deploy/helm/observecraft
          helm lint deploy/helm/observecraft -f deploy/helm/observecraft/values-ha.yaml
          helm lint deploy/helm/observecraft-agent -f deploy/helm/observecraft-agent/ci/default-values.yaml
      - name: Render tests
        run: node --test scripts/helm-chart.test.mjs
      - name: Artifact Hub annotations
        run: |
          for chart in observecraft observecraft-agent; do
            python3 deploy/helm/artifacthub-annotate.py "deploy/helm/$chart" "$(awk '/^version:/ {print $2}' deploy/helm/$chart/Chart.yaml)"
            helm lint "deploy/helm/$chart" -f "deploy/helm/$chart/ci/default-values.yaml"
          done
      # PRs test an untrusted local image. Main is built once in release.yml after ci-ok.
      - if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: ghcr.io/observecraft/observecraft:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      # Match the publishing gate: block fixable high/critical vulnerabilities.
      - if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "ghcr.io/observecraft/observecraft:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with: { cluster_name: ci }
      - name: Install and test
        if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
        run: |
          kind load docker-image ghcr.io/observecraft/observecraft:ci --name ci
          helm install observecraft deploy/helm/observecraft -n observecraft --create-namespace \
            -f deploy/helm/observecraft/ci/default-values.yaml --set image.tag=ci --wait --timeout 10m
          helm test observecraft -n observecraft --logs
          helm install observecraft-agent deploy/helm/observecraft-agent -n observecraft \
            -f deploy/helm/observecraft-agent/ci/default-values.yaml --wait --timeout 5m

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflows and embedded shell scripts
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  ci-ok:
    if: always()
    needs: [changes, server, tf-compat, licenses, web, browser, pipeline-configs, charts, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job that ran passed
        run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
