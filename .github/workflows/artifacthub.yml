# Publishes each chart's Artifact Hub repository metadata (deploy/helm/<chart>/artifacthub-repo.yml) to its OCI
# repository under the tag `artifacthub.io`, where Artifact Hub reads it (verified publisher).
name: artifacthub

on:
  push:
    branches: [main]
    paths: ["deploy/helm/*/artifacthub-repo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Push
        env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in observecraft observecraft-agent; do
            (cd "deploy/helm/$chart" && oras push "ghcr.io/observecraft/charts/$chart:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml)
          done
