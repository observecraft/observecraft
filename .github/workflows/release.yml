# On a version tag (v1.2.3): multi-arch images and Helm charts (OCI) on GHCR.
#   docker pull ghcr.io/observecraft/observecraft:1.2.3
#   helm install observecraft oci://ghcr.io/observecraft/charts/observecraft --version 1.2.3
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: observecraft, context: ., file: server/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      # Image tags match the charts' appVersion: the tag without its "v".
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/observecraft/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ghcr.io/observecraft/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  charts:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in observecraft observecraft-agent; do
            helm package "deploy/helm/$chart" --version "$version" --app-version "$version" -d dist
            helm push "dist/$chart-$version.tgz" oci://ghcr.io/observecraft/charts
          done
