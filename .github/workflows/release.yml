# Every push to main that changes the image's sources (server/, web/) publishes edge images
# (ghcr.io/observecraft/observecraft:main and :sha-<commit>).
# Releases are cut by release-please: it keeps a release pull request open with the next version and the changelog
# (from Conventional Commits); merging it tags vX.Y.Z, and this run then also publishes:
#   docker pull ghcr.io/observecraft/observecraft:X.Y.Z
#   helm install observecraft oci://ghcr.io/observecraft/charts/observecraft --version X.Y.Z
# Charts get their Artifact Hub annotations (images, changes) at packaging time (deploy/helm/artifacthub-annotate.py).
# Images are built natively per architecture, then signed (cosign, keyless), attested (build provenance, SPDX SBOM)
# and scanned (Trivy, results in the Security tab). Charts are signed too, and a release is installed from the
# registry into a kind cluster before the run passes.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/observecraft/observecraft
  CHARTS: ghcr.io/observecraft/charts

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Edge images only when what goes into the image changed; a release always builds.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.f.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            image:
              - server/**
              - web/**
              - .github/workflows/release.yml

  images:
    needs: [release-please, changes]
    if: needs.release-please.outputs.released == 'true' || needs.changes.outputs.image == 'true'
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Pushed by digest only; the manifest job tags the multi-arch image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          # Provenance and SBOM are attested on the final image instead (see the manifest job).
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "digests-${{ matrix.arch }}", path: digests/*, retention-days: 1, if-no-files-found: error }

  manifest:
    needs: [release-please, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing and attestations
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: digests, pattern: digests-*, merge-multiple: true }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Image tags match the charts' appVersion: the version without its "v".
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.released == 'true' }}
      - id: push
        working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  scan:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Credentials, so the scan also works while a package is private.
        env: { TRIVY_USERNAME: "${{ github.actor }}", TRIVY_PASSWORD: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.manifest.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with: { sarif_file: trivy.sarif, category: container-image }

  charts:
    needs: [release-please, manifest]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.16.4 }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign
        env: { VERSION: "${{ needs.release-please.outputs.version }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in observecraft observecraft-agent; do
            python3 deploy/helm/artifacthub-annotate.py "deploy/helm/$chart" "$VERSION"
            helm package "deploy/helm/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
            digest=$(helm push "dist/$chart-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
            cosign sign --yes "$CHARTS/$chart@$digest"
          done

  # Installs the release the way users will: chart and image from the registry.
  verify:
    needs: [release-please, charts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.16.4 }
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { cluster_name: verify }
      - name: Install from the registry
        env: { VERSION: "${{ needs.release-please.outputs.version }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        # Logged in and the image preloaded, so this also works while the packages are still private.
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$VERSION" && kind load docker-image "$IMAGE:$VERSION" --name verify
          helm install observecraft "oci://$CHARTS/observecraft" --version "$VERSION" -n observecraft --create-namespace \
            -f deploy/helm/observecraft/ci/default-values.yaml --wait --timeout 10m
          helm test observecraft -n observecraft --logs
