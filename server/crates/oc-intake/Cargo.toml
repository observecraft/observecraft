[package]
name = "oc-intake"
description = "Authenticated telemetry intake: OTLP/HTTP and JSON logs, stamped with the sender's organization"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "oc-intake"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http2"] }
bytes = "1"
# Datadog payloads: zlib/deflate, gzip and zstd bodies; protobuf series (agent-payload).
flate2 = "1"
prost = "0.14"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
tokio.workspace = true
# OTLP/gRPC: framing, compression and status codes only (messages are passed through undecoded).
tonic = { version = "0.12", default-features = false, features = ["gzip", "zstd"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
