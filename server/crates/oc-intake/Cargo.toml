[package]
name = "oc-intake"
description = "Authenticated telemetry intake: OTLP/HTTP and JSON logs, stamped with the sender's organization"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "oc-intake"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http2", "multipart"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Datadog payloads: zlib/deflate, gzip and zstd bodies; protobuf series (agent-payload).
flate2 = "1"
prost = "0.14"
rand = "0.10"
# Data Streams Monitoring's pathway stats (msgpack with DDSketch bytes).
rmp-serde = "1.3"
serde_bytes = "0.11"
oc-flags.workspace = true
oc-query.workspace = true
reqwest.workspace = true
rskafka.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
# Query strings of RUM SDK requests (`?ddforward=`, `ddtags`).
url = "2"
sqlx.workspace = true
tokio.workspace = true
# OTLP/gRPC: framing, compression and status codes only (messages are passed through undecoded).
tonic = { version = "0.14", default-features = false, features = ["gzip", "zstd"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
