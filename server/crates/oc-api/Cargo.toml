description = "ObserveCraft API server (REST + SSE) for the web app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "observecraft-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
argon2 = "0.5"
