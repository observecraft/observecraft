[package]
name = "oc-api"
description = "ObserveCraft API server (REST + SSE) for the web app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "observecraft-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
argon2 = "0.5"
async-nats.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64 = "0.22"
# Log pipelines: dates parsed by grok `date()` and the date remapper.
chrono = { version = "0.4", default-features = false, features = ["std"] }
clickhouse.workspace = true
data-encoding = "2"
# Log pipelines: grok patterns use atomic groups and lookarounds, which `regex` lacks.
fancy-regex = "0.20"
# Archive search over Parquet files (C++ engine compiled in; Parquet reader included).
duckdb = { version = "=1.10506.0", features = ["bundled", "parquet"] }
# Profiles: gzip-compressed pprof uploads.
flate2 = "1"
futures.workspace = true
hmac = "0.12"
# Monitor notification email (SMTP over rustls).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1-rustls-tls"] }
oc-query.workspace = true
oc-store.workspace = true
openidconnect = "4"
prost = "0.13"
rand = "0.8"
reqwest.workspace = true
# S3 request signing (sans-IO; requests are sent with reqwest).
rusty-s3 = "0.10.2"
samael = { version = "0.0.22", features = ["xmlsec"] }
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
utoipa.workspace = true
