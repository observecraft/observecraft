[package]
name = "oc-api"
description = "ObserveCraft API server (REST + SSE) for the web app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "observecraft-server"
path = "src/main.rs"

[dependencies]
# AWS integration crawler: the official AWS SDK (Apache-2.0) for the server's AWS identity, STS AssumeRole,
# CloudWatch and resource tags.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-s3 = "1"
aws-sdk-resourcegroupstagging = "1"
# Resources whose ARNs their metrics don't carry (aws/naming.rs LOOKUPS): REST APIs, RDS proxies, DMS replication
# instances, WAF Classic web ACLs.
aws-sdk-apigateway = "1"
aws-sdk-databasemigration = "1"
aws-sdk-rds = "1"
aws-sdk-waf = "1"
aws-sdk-wafregional = "1"
# GCP integration crawler: this install's Application Default Credentials (metadata server, workload identity, key file).
gcp_auth = "0.12"
aes-gcm = "0.11"
anyhow.workspace = true
argon2 = "0.6"
async-trait = "0.1"
rskafka.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64 = "0.23"
# Log pipelines: dates parsed by grok `date()` and the date remapper.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# On-Call schedules: rotations and restrictions in the schedule's IANA time zone (DST-aware).
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
clickhouse.workspace = true
data-encoding = "2"
# Log pipelines: grok patterns use atomic groups and lookarounds, which `regex` lacks.
fancy-regex = "0.20"
# AI Guard's evaluator and sensitive data scanners (linear-time matching on untrusted prompts).
regex = "1"
# Archive search over Parquet files (C++ engine compiled in; Parquet reader included).
duckdb = { version = "=1.20000.1", features = ["bundled", "parquet", "json"] }
# Profiles: gzip-compressed pprof uploads.
flate2 = "1"
futures.workspace = true
hmac = "0.13"
# Per-org ClickHouse query limits: the clickhouse client's HTTP client with a connector that
# hands out an org's connections only with one of its permits (org_limits.rs).
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# Synthetic HTTP tests send their request over a connection they open and time themselves.
http-body-util = "0.1"
tower-service = "0.3"
# Synthetic DNS tests: record lookups (A, AAAA, CNAME, MX, TXT, NS) with the system's or a chosen server.
hickory-resolver = { version = "0.26.2", default-features = false, features = ["system-config", "tokio"] }
# Monitor notification email (SMTP over rustls).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1-rustls-tls"] }
oc-connectors.workspace = true
oc-flags = { workspace = true, features = ["openapi"] }
oc-query.workspace = true
oc-store.workspace = true
openidconnect = "4"
prost = "0.14"
rand = "0.10"
# Shared result cache on Valkey (BSD-3-Clause): async connection manager, TLS (rediss://) over rustls.
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots", "script"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
# Shared cache values: MessagePack (self-describing like JSON, but smaller and faster).
rmp-serde = "1.3"
# Synthetic SSL tests: the handshake and the server's certificate chain (the rustls reqwest uses).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# S3 request signing (sans-IO; requests are sent with reqwest).
rusty-s3 = "0.11"
samael = { version = "0.0.22", features = ["xmlsec"] }
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
# Developer Portal: entity definition documents imported as YAML.
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
utoipa.workspace = true
webpki-roots = "1"
# Synthetic SSL tests: the certificate's subject, issuer and validity.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
# Shared cache values, zstd-compressed.
zstd = "0.14"
