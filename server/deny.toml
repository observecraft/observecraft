# cargo-deny: dependency licenses and advisories (run in CI: `cargo deny check licenses advisories`).
# ObserveCraft is MIT, so only permissive licenses (and MPL-2.0, used unmodified) are allowed.

[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
