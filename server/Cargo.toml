[workspace]
resolver = "2"
members = ["crates/oc-query", "crates/oc-store", "crates/oc-api", "crates/oc-intake", "crates/oc-tracegen", "crates/oc-flags"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
clickhouse = "0.13"
futures = "0.3"
# Kafka (docs/adr/0004): pure Rust, no librdkafka build. zstd batches.
rskafka = { version = "0.6", default-features = false, features = ["compression-zstd", "transport-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }

oc-flags = { path = "crates/oc-flags" }
oc-query = { path = "crates/oc-query" }
oc-store = { path = "crates/oc-store" }
