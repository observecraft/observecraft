[workspace]
resolver = "2"
members = ["crates/oc-connectors", "crates/oc-query", "crates/oc-store", "crates/oc-api", "crates/oc-intake", "crates/oc-tracegen", "crates/oc-flags"]

[workspace.package]
edition = "2021"
# The toolchain CI builds with (.github/workflows/ci.yml); the resolver picks dependency versions that support it.
rust-version = "1.94"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clickhouse = "0.15"
futures = "0.3"
# Kafka (docs/adr/0004): pure Rust, no librdkafka build. zstd batches.
rskafka = { version = "0.6", default-features = false, features = ["compression-zstd", "transport-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tls-rustls-aws-lc-rs: managed Postgres (Amazon RDS, Azure, Cloud SQL) requires TLS (sslmode=require); aws-lc-rs is
# the provider rustls already uses here.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls-aws-lc-rs"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras"] }

oc-connectors = { path = "crates/oc-connectors" }
oc-flags = { path = "crates/oc-flags" }
oc-query = { path = "crates/oc-query" }
oc-store = { path = "crates/oc-store" }
