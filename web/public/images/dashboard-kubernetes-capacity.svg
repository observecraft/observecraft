<g font-family="Arial,sans-serif" fill="#153e3b"><text x="42" y="58" font-size="26" font-weight="bold">From cluster capacity to workload use</text><text x="42" y="93" font-size="17">A shared resource budget, scheduled one pod at a time.</text></g>
