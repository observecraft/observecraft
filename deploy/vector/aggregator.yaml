# Vector aggregator: one normalization point for every log source.
#   inputs : the OTel Collector (OTLP :4317/:4318; resources carry oc.org_id), JSON logs from oc-intake
#            (Kafka oc.logs.json, organization in the record's x-oc-org header; or HTTP :8687 when the
#            intake runs without Kafka) and trusted in-cluster Vector agents (vector protocol :6000;
#            events must set org_id)
#   outputs: ClickHouse oc.logs_raw_dedup (every log; archives use oc.logs_raw_read), the server's log
#            indexer (routes logs to the org's indexes → oc.logs_dedup) and Kafka oc.logs.live (live tail,
#            keyed by org)
# Events without an organization are dropped: nothing is stored that no tenant owns.
# Endpoints come from the environment (defaults: the compose service names); the Helm chart mounts this file.
data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  agents:
    type: vector
    address: 0.0.0.0:6000

  otlp:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318

  # JSON log events (an object or an array of objects) forwarded by oc-intake after key validation.
  intake:
    type: http_server
    address: 0.0.0.0:8687
    decoding:
      codec: json
    headers: ["x-oc-org"]

  # Offsets remain uncommitted until both storage sinks deliver. Disk buffers acknowledge on local
  # persistence, which would transfer durability away from Kafka to one pod's volume.
  kafka:
    type: kafka
    bootstrap_servers: "${OC_KAFKA_BROKERS:-kafka:9092}"
    group_id: oc-vector
    topics: [oc.logs.json]
    auto_offset_reset: earliest
    decoding:
      codec: json
    key_field: _oc_kafka_key
    topic_key: _oc_kafka_topic
    partition_key: _oc_kafka_partition
    offset_key: _oc_kafka_offset
    headers_key: _oc_kafka_headers

transforms:
  # Output shape = oc.logs columns (+ ts_ms for live tail consumers).
  normalize:
    type: remap
    inputs: [agents, otlp.logs, intake, kafka]
    drop_on_abort: true
    # Datadog-style preprocessing, metadata → tags, reserved attributes. Tested by vector/tests.yaml
    # (`docker compose run --rm vector-aggregator test /etc/vector/aggregator.yaml /etc/vector/tests.yaml`).
    file: /etc/vector/normalize.vrl

sinks:
  clickhouse:
    type: clickhouse
    inputs: [normalize]
    endpoint: "${OC_CLICKHOUSE_HTTP_ENDPOINT:-http://clickhouse:8123}"
    database: oc
    table: logs_raw_dedup
    acknowledgements:
      enabled: true
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    date_time_best_effort: true
    compression: gzip
    batch:
      timeout_secs: 1
      max_events: 20000
    # Kafka (or the waiting OTLP sender) owns these events until ClickHouse acknowledges them.
    buffer:
      type: memory
      max_events: 10000
      when_full: block

  # Index routing, exclusion filters and quotas happen in the server (OC_LOGPROC_URL).
  indexer:
    type: http
    inputs: [normalize]
    uri: "${OC_LOGPROC_URL}"
    acknowledgements:
      enabled: true
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        authorization: "Bearer ${OC_INTERNAL_TOKEN:-none}"
      retry_attempts: 1000000
    batch:
      timeout_secs: 1
      max_events: 10000
    # Do not acknowledge to Kafka/OTLP merely because this pod buffered an event on disk.
    buffer:
      type: memory
      max_events: 10000
      when_full: block

  live:
    type: kafka
    inputs: [normalize]
    bootstrap_servers: "${OC_KAFKA_BROKERS:-kafka:9092}"
    topic: oc.logs.live
    key_field: org_id
    compression: zstd
    # Kafka's Java partitioner: the server computes an org's partition the same way (live_feed.rs).
    librdkafka_options:
      partitioner: murmur2_random
    encoding:
      codec: json
    # Live tail is best-effort: never let it back-pressure storage.
    acknowledgements:
      enabled: false
    buffer:
      type: memory
      max_events: 10000
      when_full: drop_newest
