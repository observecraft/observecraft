# Vector aggregator: one normalization point for every log source.
#   inputs : the OTel Collector (OTLP :4317/:4318; resources carry oc.org_id), JSON logs from oc-intake
#            (HTTP :8687; organization in the x-oc-org header) and trusted in-cluster Vector agents
#            (vector protocol :6000; events must set org_id)
#   outputs: ClickHouse oc.logs_raw (every log, kept briefly; archives read it), the server's log
#            indexer (routes logs to the org's indexes → oc.logs) and NATS oc.logs.live.<org> (live tail)
# Events without an organization are dropped: nothing is stored that no tenant owns.
data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  agents:
    type: vector
    address: 0.0.0.0:6000

  otlp:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318

  # JSON log events (an object or an array of objects) forwarded by oc-intake after key validation.
  intake:
    type: http_server
    address: 0.0.0.0:8687
    decoding:
      codec: json
    headers: ["x-oc-org"]

transforms:
  # Output shape = oc.logs columns (+ ts_ms for live tail consumers).
  normalize:
    type: remap
    inputs: [agents, otlp.logs, intake]
    drop_on_abort: true
    # Datadog-style preprocessing, metadata → tags, reserved attributes. Tested by vector/tests.yaml
    # (`docker compose run --rm vector-aggregator test /etc/vector/aggregator.yaml /etc/vector/tests.yaml`).
    file: /etc/vector/normalize.vrl

sinks:
  clickhouse:
    type: clickhouse
    inputs: [normalize]
    endpoint: http://clickhouse:8123
    database: oc
    table: logs_raw
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: true
    date_time_best_effort: true
    compression: gzip
    batch:
      timeout_secs: 1
      max_events: 20000
    # Survives ClickHouse restarts without dropping logs.
    buffer:
      type: disk
      max_size: 536870912
      when_full: block

  # Index routing, exclusion filters and quotas happen in the server (OC_LOGPROC_URL).
  indexer:
    type: http
    inputs: [normalize]
    uri: "${OC_LOGPROC_URL}"
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        authorization: "Bearer ${OC_INTERNAL_TOKEN:-none}"
      retry_attempts: 1000000
    batch:
      timeout_secs: 1
      max_events: 10000
    # Survives server restarts without losing logs.
    buffer:
      type: disk
      max_size: 536870912
      when_full: block

  live:
    type: nats
    inputs: [normalize]
    url: nats://nats:4222
    subject: "oc.logs.live.{{ org_id }}"
    encoding:
      codec: json
    # Live tail is best-effort: never let it back-pressure storage.
    buffer:
      type: memory
      max_events: 10000
      when_full: drop_newest
