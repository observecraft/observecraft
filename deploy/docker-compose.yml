# Local ObserveCraft stack.
#   make up            → storage + pipeline + synthetic load
#   make server        → API on :8080 (cargo run), or `docker compose --profile app up` for the container
#
# Data flow:
#   loadgen (Vector agent) ──vector──► vector-aggregator ──► ClickHouse oc.logs
#   apps ──OTLP──► otel-collector ──logs──► vector-aggregator      └──► NATS oc.logs.live.<org>
#                                 └─traces/metrics──► ClickHouse otel.*
name: observecraft

x-ch-auth: &ch-auth
  CLICKHOUSE_USER: observecraft
  CLICKHOUSE_PASSWORD: observecraft

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      <<: *ch-auth
      CLICKHOUSE_DB: oc
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: observecraft
      POSTGRES_USER: observecraft
      POSTGRES_PASSWORD: observecraft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observecraft"]
      interval: 5s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # clients
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  vector-aggregator:
    image: timberio/vector:0.42.0-debian
    restart: unless-stopped
    command: ["--config", "/etc/vector/aggregator.yaml"]
    environment:
      <<: *ch-auth
      # The server's log indexer. `make up` points it at a server running on the host.
      OC_LOGPROC_URL: ${OC_LOGPROC_URL:-http://server:8090/ingest/logs}
      OC_INTERNAL_TOKEN: ${OC_INTERNAL_TOKEN:-}
    volumes:
      - ./vector:/etc/vector:ro
      # Disk buffer in front of ClickHouse: survives restarts and container re-creation.
      - vector-data:/var/lib/vector
    ports:
      - "6000:6000" # vector protocol (trusted agents)
      - "8686:8686" # vector API / health
      - "127.0.0.1:8687:8687" # JSON logs from oc-intake (internal)
    depends_on:
      clickhouse: { condition: service_healthy }
      nats: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml", "--config=/etc/otelcol-contrib/hostmetrics.yaml"]
    environment:
      <<: *ch-auth
      OC_HOST_NAME: ${OC_HOST_NAME:-docker-dev-host}
      # Organization the collector's own host metrics belong to.
      OC_HOST_ORG: ${OC_HOST_ORG:-default}
    # Root only so it can write its queue to the named volume (the image's user can't).
    user: "0:0"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./otel/hostmetrics.yaml:/etc/otelcol-contrib/hostmetrics.yaml:ro
      # Export queue on disk: spans and metrics survive a restart or a ClickHouse outage.
      - collector-queue:/var/lib/otelcol/queue
    # Internal only: senders go through oc-intake (:4318), which authenticates them. Published on
    # loopback so an intake running on the host (make intake) can reach it.
    ports:
      - "127.0.0.1:14318:4318" # OTLP HTTP
    depends_on:
      clickhouse: { condition: service_healthy }
      vector-aggregator: { condition: service_started }

  # S3-compatible object storage (RustFS) for log archives: a local stand-in for S3 / GCS / R2.
  # S3 API on :9100 (in the network: rustfs:9000), web console on :9101.
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${OC_DEMO_ARCHIVE_ACCESS_KEY:-observecraft}
      RUSTFS_SECRET_KEY: ${OC_DEMO_ARCHIVE_SECRET_KEY:-observecraft-archive-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9100:9000"
      - "9101:9001"

  # Synthetic application logs so the UI has live data.
  loadgen:
    image: timberio/vector:0.42.0-debian
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector/loadgen.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      vector-aggregator: { condition: service_started }

  server:
    profiles: ["app"]
    # The published image (OC_VERSION=0.1.0 pins a release); built from source when it can't be pulled.
    image: ghcr.io/observecraft/observecraft:${OC_VERSION:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      OC_CLICKHOUSE_URL: http://clickhouse:8123
      OC_POSTGRES_URL: postgres://observecraft:observecraft@postgres:5432/observecraft
      OC_NATS_URL: nats://nats:4222
      OC_CORS_ORIGINS: ${OC_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # The containerised server also serves the web app on :8080.
      OC_PUBLIC_URL: ${OC_PUBLIC_URL:-http://localhost:8080}
      OC_INSTANCE_ADMIN_EMAIL: ${OC_INSTANCE_ADMIN_EMAIL:-}
      OC_DEMO_INGEST_KEY: ${OC_DEMO_INGEST_KEY:-ocik_local_demo_only_do_not_use_in_production}
      OC_DEMO_ARCHIVE_ENDPOINT: http://rustfs:9000
      OC_INTERNAL_TOKEN: ${OC_INTERNAL_TOKEN:-}
      OC_DATA_DIR: /var/lib/observecraft
      OC_SECRET_KEY: ${OC_SECRET_KEY:-}
      OC_COOKIE_SECURE: ${OC_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  # The public telemetry endpoint: OTLP (HTTP :4318, gRPC :4317) and the Datadog logs / metrics APIs,
  # authenticated by ingest API key.
  intake:
    profiles: ["app"]
    image: ghcr.io/observecraft/observecraft:${OC_VERSION:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    entrypoint: ["oc-intake"]
    restart: unless-stopped
    environment:
      OC_POSTGRES_URL: postgres://observecraft:observecraft@postgres:5432/observecraft
      OC_INTAKE_COLLECTOR_URL: http://otel-collector:4318
      OC_INTAKE_LOGS_URL: http://vector-aggregator:8687
      OC_INTAKE_PROFILES_URL: http://server:8090/ingest/profiles
      OC_INTERNAL_TOKEN: ${OC_INTERNAL_TOKEN:-}
    ports:
      - "4318:4318"
      - "4317:4317"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }

  # Synthetic OTLP traces for APM (services, dependencies, N+1 calls, errors, rolling deploys).
  tracegen:
    profiles: ["app"]
    image: ghcr.io/observecraft/observecraft:${OC_VERSION:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    entrypoint: ["oc-tracegen"]
    restart: unless-stopped
    environment:
      <<: *ch-auth
      OTLP_ENDPOINT: http://intake:4318
      OC_INGEST_KEY: ${OC_DEMO_INGEST_KEY:-ocik_local_demo_only_do_not_use_in_production}
      TRACES_PER_SEC: "20"
      CLICKHOUSE_HTTP: http://clickhouse:8123
    depends_on:
      intake: { condition: service_started }

  # ---- TLS termination (`--profile tls`, with `--profile app`): automatic HTTPS for the app and the intake.
  caddy:
    profiles: ["tls"]
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      OC_DOMAIN: ${OC_DOMAIN:-localhost}
      OC_INTAKE_DOMAIN: ${OC_INTAKE_DOMAIN:-intake.localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server: { condition: service_started }
      intake: { condition: service_started }

  # ---- Local identity providers for testing SSO (`docker compose --profile sso up -d`). Never use in production.
  # SAML IdP (SimpleSAMLphp). Users: user1 / user1pass, user2 / user2pass. Metadata: http://localhost:8081/simplesaml/saml2/idp/metadata.php
  saml-idp:
    profiles: ["sso"]
    image: kristophjunge/test-saml-idp:1.15
    platform: linux/amd64
    volumes:
      - ./sso/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
    ports:
      - "8081:8080"

  # OIDC provider (mock-oauth2-server). Issuer: http://localhost:8082/default. Client id/secret: any.
  oidc-idp:
    profiles: ["sso"]
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 300,
          "requestMappings": [{"requestParam": "grant_type", "match": "*",
            "claims": {"sub": "oidc-user-1", "email": "oidc.user@example.com", "name": "Oidc User",
                       "groups": ["sre-group"], "aud": ["observecraft"]}}]}]}
    ports:
      - "8082:8080"

volumes:
  collector-queue:
  clickhouse-data:
  postgres-data:
  rustfs-data:
  vector-data:
  caddy-data:
