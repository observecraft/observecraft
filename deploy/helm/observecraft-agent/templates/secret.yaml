{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ required "apiKey or existingSecret is required (an ingest API key: Organization Settings → API Keys)" .Values.apiKey | b64enc }}
{{- end }}
