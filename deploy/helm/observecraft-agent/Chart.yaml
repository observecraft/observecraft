apiVersion: v2
name: observecraft-agent
description: >-
  OpenTelemetry Collector for ObserveCraft on Kubernetes (for clusters without
  the Datadog Agent). A node agent (logs, kubelet and host metrics, OTLP /
  Datadog / DogStatsD endpoints for applications, Prometheus autodiscovery) and
  a cluster agent (cluster state, object inventory, events).
type: application
version: 0.4.0
appVersion: 0.4.0
kubeVersion: '>=1.24.0-0'
home: https://github.com/observecraft/observecraft
sources:
  - https://github.com/observecraft/observecraft
icon: >-
  https://raw.githubusercontent.com/observecraft/observecraft/main/docs/assets/logo.svg
keywords:
  - observability
  - opentelemetry
  - agent
  - kubernetes
  - logs
  - metrics
  - datadog
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: monitoring-logging
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/observecraft/observecraft#readme
    - name: Sending data
      url: https://github.com/observecraft/observecraft/blob/main/docs/sending-data.md
    - name: Changelog
      url: https://github.com/observecraft/observecraft/blob/main/CHANGELOG.md
    - name: Verifying releases
      url: https://github.com/observecraft/observecraft/blob/main/SECURITY.md#verifying-releases
