{{- $fullname := include "oc.fullname" . -}}
{{- $secret := include "oc.secretName" . -}}
{{- $ch := .Values.clickhouse -}}
{{- $q := $ch.quota -}}
{{- if eq $ch.mode "bundled" }}
# Single ClickHouse server. Users: the server's (per-org quota keyed by the org it sends as
# quota_key) and an insert-only writer for the collector and Vector. `default` is local only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-clickhouse
  labels:
    {{- include "oc.componentLabels" (list . "clickhouse") | nindent 4 }}
data:
  observecraft-config.xml: |
    <clickhouse>
      <logger><level>information</level><console>1</console><log remove="1"/><errorlog remove="1"/></logger>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  observecraft-users.xml: |
    <clickhouse>
      <users>
        <default>
          <networks replace="replace"><ip>::1</ip><ip>127.0.0.1</ip></networks>
        </default>
        <{{ $ch.user }}>
          <password from_env="OC_CH_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>{{ ternary "per_org" "default" $q.enabled }}</quota>
          <access_management>1</access_management>
        </{{ $ch.user }}>
        <{{ $ch.ingestUser }}>
          <password from_env="OC_CH_INGEST_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT INSERT, SELECT, SHOW ON oc.*</query>
            <query>GRANT INSERT, SELECT, SHOW ON otel.*</query>
          </grants>
        </{{ $ch.ingestUser }}>
      </users>
      <quotas>
        <per_org>
          <keyed/>
          <interval>
            <duration>{{ $q.intervalSeconds }}</duration>
            <query_selects>{{ $q.selects }}</query_selects>
            <execution_time>{{ $q.executionTimeSeconds }}</execution_time>
            <read_rows>{{ $q.readRows | int64 }}</read_rows>
          </interval>
        </per_org>
      </quotas>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-clickhouse
  labels:
    {{- include "oc.componentLabels" (list . "clickhouse") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "oc.selector" (list . "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oc.selector" (list . "clickhouse") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $ch | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "oc.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with $ch.bundled.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ch.bundled.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ch.bundled.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ include "oc.imageOf" (list . $ch.bundled.image) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: CLICKHOUSE_SKIP_USER_SETUP, value: "1" }
            - name: OC_CH_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: clickhouse-password } }
            - name: OC_CH_INGEST_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: clickhouse-ingest-password } }
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $ch.bundled.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: logs, mountPath: /var/log/clickhouse-server }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/observecraft-config.xml, subPath: observecraft-config.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/observecraft-users.xml, subPath: observecraft-users.xml }
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-clickhouse }
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "oc.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $ch.bundled.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-clickhouse
  labels:
    {{- include "oc.componentLabels" (list . "clickhouse") | nindent 4 }}
spec:
  selector:
    {{- include "oc.selector" (list . "clickhouse") | nindent 4 }}
  ports:
    - { name: http, port: 8123, targetPort: http }
    - { name: native, port: 9000, targetPort: native }
{{- else if eq $ch.mode "operator" }}
{{- $op := $ch.operator }}
# Sharded, replicated ClickHouse managed by the Altinity operator, coordinated by ClickHouse Keeper.
# The server creates every table ON CLUSTER {{ $op.cluster }}: replicated tables per shard plus
# Distributed tables (the names the application uses) spreading rows over the shards.
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "oc.componentLabels" (list . "keeper") | nindent 4 }}
spec:
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: data
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: {{ $op.keeper.replicas }}
  templates:
    podTemplates:
      - name: keeper
        spec:
          containers:
            - name: clickhouse-keeper
              image: {{ include "oc.imageOf" (list . $op.keeper.image) }}
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          {{- include "oc.storageClass" . | nindent 10 }}
          resources:
            requests:
              storage: {{ $op.keeper.persistence.size }}
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "oc.componentLabels" (list . "clickhouse") | nindent 4 }}
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  configuration:
    zookeeper:
      nodes:
        - host: keeper-{{ $fullname }}
          port: 2181
    clusters:
      - name: {{ $op.cluster }}
        layout:
          shardsCount: {{ $op.shards }}
          replicasCount: {{ $op.replicas }}
    users:
      {{ $ch.user }}/k8s_secret_password: {{ $secret }}/clickhouse-password
      {{ $ch.user }}/networks/ip: ["::/0"]
      {{ $ch.user }}/profile: default
      {{ $ch.user }}/quota: {{ ternary "per_org" "default" $q.enabled }}
      {{ $ch.user }}/access_management: 1
      {{ $ch.ingestUser }}/k8s_secret_password: {{ $secret }}/clickhouse-ingest-password
      {{ $ch.ingestUser }}/networks/ip: ["::/0"]
      {{ $ch.ingestUser }}/profile: default
      {{ $ch.ingestUser }}/grants/query:
        - "GRANT INSERT, SELECT, SHOW ON oc.*"
        - "GRANT INSERT, SELECT, SHOW ON otel.*"
    quotas:
      per_org/keyed: ""
      per_org/interval/duration: {{ $q.intervalSeconds }}
      per_org/interval/query_selects: {{ $q.selects }}
      per_org/interval/execution_time: {{ $q.executionTimeSeconds }}
      per_org/interval/read_rows: {{ $q.readRows | int64 }}
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: {{ include "oc.imageOf" (list . $op.image) }}
              resources:
                {{- toYaml $op.resources | nindent 16 }}
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          {{- include "oc.storageClass" . | nindent 10 }}
          resources:
            requests:
              storage: {{ $op.persistence.size }}
{{- end }}
