{{- if .Values.nats.enabled }}
{{- $fullname := include "oc.fullname" . -}}
{{- $n := int .Values.nats.replicas -}}
# NATS for live tail (core pub/sub only, nothing stored).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "oc.componentLabels" (list . "nats") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-nats-headless
  replicas: {{ $n }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "oc.selector" (list . "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oc.selector" (list . "nats") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "oc.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: {{ include "oc.imageOf" (list . .Values.nats.image) }}
          args:
            - --http_port=8222
            {{- if gt $n 1 }}
            - --cluster_name=observecraft
            - --cluster=nats://0.0.0.0:6222
            - --routes={{ range $i, $_ := until $n }}{{ if $i }},{{ end }}nats://{{ $fullname }}-nats-{{ $i }}.{{ $fullname }}-nats-headless:6222{{ end }}
            {{- end }}
          {{- include "oc.containerSecurity" . | nindent 10 }}
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
          livenessProbe:
            httpGet: { path: /healthz, port: monitor }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "oc.componentLabels" (list . "nats") | nindent 4 }}
spec:
  selector:
    {{- include "oc.selector" (list . "nats") | nindent 4 }}
  ports:
    - { name: client, port: 4222, targetPort: client }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nats-headless
  labels:
    {{- include "oc.componentLabels" (list . "nats") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "oc.selector" (list . "nats") | nindent 4 }}
  ports:
    - { name: cluster, port: 6222 }
{{- end }}
