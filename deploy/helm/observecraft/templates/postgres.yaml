{{- $fullname := include "oc.fullname" . -}}
{{- $secret := include "oc.secretName" . -}}
{{- $pg := .Values.postgres -}}
{{- if eq $pg.mode "bundled" }}
# Single Postgres (metadata: users, dashboards, monitors, incidents, settings).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "oc.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "oc.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oc.selector" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "oc.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ include "oc.imageOf" (list . $pg.bundled.image) }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: POSTGRES_DB, value: {{ $pg.database | quote }} }
            - { name: POSTGRES_USER, value: {{ $pg.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ $pg.user | quote }}, -d, {{ $pg.database | quote }}] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, {{ $pg.user | quote }}, -d, {{ $pg.database | quote }}] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $pg.bundled.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "oc.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $pg.bundled.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "oc.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "oc.selector" (list . "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- else if eq $pg.mode "operator" }}
# Postgres cluster managed by CloudNativePG: a primary and streaming replicas with automatic
# failover. The operator writes the connection URI to the secret {{ $fullname }}-postgres-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "oc.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  instances: {{ $pg.operator.instances }}
  imageName: {{ $pg.operator.imageName }}
  bootstrap:
    initdb:
      database: {{ $pg.database }}
      owner: {{ $pg.user }}
  storage:
    size: {{ $pg.operator.persistence.size }}
    {{- with .Values.global.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml $pg.operator.resources | nindent 4 }}
{{- end }}
