{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "oc.fullname" . -}}
{{- /* component → list of [port, [allowed components]]; "*" = anyone (the intake authenticates
     every request), "ingress" = networkPolicy.ingressFrom (anyone when empty), "kafka-jmx" =
     kafka.jmx.allowFrom (anyone when empty: the Datadog Agent's namespace). Egress is open:
     archives (S3), notifications (SMTP, webhooks) and SSO reach outside the cluster. */ -}}
{{- $rules := dict
  "server" (list (list 8080 (list "ingress")) (list 8090 (list "vector" "intake" "scanner")))
  "intake" (list (list 4318 (list "*")) (list 4317 (list "*")))
  "collector" (list (list 4318 (list "intake")) (list 4317 (list "intake")))
-}}
{{- if eq .Values.server.logIngest "vector" }}
{{- $_ := set $rules "vector" (list (list 4317 (list "collector")) (list 8687 (list "intake"))) }}
{{- end }}
{{- if eq .Values.clickhouse.mode "bundled" }}
{{- $_ := set $rules "clickhouse" (list (list 8123 (list "server" "vector")) (list 9000 (list "server" "collector"))) }}
{{- end }}
{{- if eq .Values.postgres.mode "bundled" }}
{{- $_ := set $rules "postgres" (list (list 5432 (list "server" "intake"))) }}
{{- end }}
{{- if eq .Values.cache.mode "bundled" }}
{{- $_ := set $rules "valkey" (list (list 6379 (list "server"))) }}
{{- end }}
{{- if .Values.browser.enabled }}
{{- $_ := set $rules "browser" (list (list 8095 (list "server"))) }}
{{- end }}
{{- if .Values.kafka.enabled }}
{{- $_ := set $rules "kafka" (list (list 9092 (list "intake" "server" "collector" "vector" "kafka" "kafka-topics")) (list 9093 (list "kafka"))) }}
{{- if .Values.kafka.jmx.enabled }}
{{- $_ := set $rules "kafka" (append $rules.kafka (list (int .Values.kafka.jmx.port) (list "kafka-jmx"))) }}
{{- end }}
{{- end }}
{{- range $component, $ports := $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "oc.componentLabels" (list $ $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oc.selector" (list $ $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range $ports }}
    {{- $port := index . 0 }}{{- $from := index . 1 }}
    - ports: [{ port: {{ $port }} }]
      {{- if has "*" $from }}
      {{- else if has "ingress" $from }}
      {{- with $.Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else if has "kafka-jmx" $from }}
      {{- with $.Values.kafka.jmx.allowFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      from:
        {{- range $from }}
        - podSelector:
            matchLabels:
              {{- include "oc.selector" (list $ .) | nindent 14 }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
