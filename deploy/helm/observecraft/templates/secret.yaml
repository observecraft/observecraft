{{- if not .Values.secrets.existingSecret }}
{{- $name := include "oc.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "oc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ include "oc.secretValue" (list $old "secret-key" .Values.secrets.secretKey) }}
  internal-token: {{ include "oc.secretValue" (list $old "internal-token" .Values.secrets.internalToken) }}
  {{- if eq .Values.clickhouse.mode "external" }}
  clickhouse-password: {{ required "clickhouse.password (or secrets.existingSecret) is required with clickhouse.mode=external" .Values.clickhouse.password | b64enc }}
  {{- if .Values.clickhouse.external.ingestUser }}
  clickhouse-ingest-password: {{ required "clickhouse.ingestPassword is required with clickhouse.external.ingestUser" .Values.clickhouse.ingestPassword | b64enc }}
  {{- end }}
  {{- else }}
  clickhouse-password: {{ include "oc.secretValue" (list $old "clickhouse-password" .Values.clickhouse.password) }}
  clickhouse-ingest-password: {{ include "oc.secretValue" (list $old "clickhouse-ingest-password" .Values.clickhouse.ingestPassword) }}
  {{- end }}
  {{- if eq .Values.postgres.mode "bundled" }}
  postgres-password: {{ include "oc.secretValue" (list $old "postgres-password" "") }}
  {{- end }}
  {{- if eq .Values.postgres.mode "external" }}
  postgres-url: {{ required "postgres.external.url (or secrets.existingSecret with postgres-url) is required with postgres.mode=external" .Values.postgres.external.url | b64enc }}
  {{- end }}
  {{- if eq .Values.cache.mode "bundled" }}
  {{- if and .Values.cache.auth.enabled (not .Values.cache.auth.existingSecret) }}
  cache-password: {{ include "oc.secretValue" (list $old "cache-password" "") }}
  {{- end }}
  {{- else }}
  cache-url: {{ required "cache.external.url (or secrets.existingSecret with cache-url) is required with cache.mode=external" .Values.cache.external.url | b64enc }}
  {{- end }}
  {{- with .Values.smtp.url }}
  smtp-url: {{ . | b64enc }}
  {{- end }}
{{- end }}
