{{- if .Values.ingress.enabled }}
{{- $fullname := include "oc.fullname" . -}}
{{- $ing := .Values.ingress -}}
{{- $targets := dict "app" (list "server" 8080) "intake" (list "intake" 4318) }}
{{- if $ing.intakeGrpc.enabled }}{{ $_ := set $targets "intakeGrpc" (list "intake" 4317) }}{{ end }}
{{- range $name, $target := $targets }}
{{- $cfg := index $ing $name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-{{ $name | kebabcase }}
  labels:
    {{- include "oc.componentLabels" (list $ (index $target 0)) | nindent 4 }}
  annotations:
    {{- with $ing.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $cfg.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls }}
  tls:
    - hosts: [{{ $cfg.host | quote }}]
      secretName: {{ $cfg.tlsSecretName | default (printf "%s-%s-tls" $fullname ($name | kebabcase)) }}
  {{- end }}
  rules:
    - host: {{ $cfg.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-{{ index $target 0 }}
                port: { number: {{ index $target 1 }} }
{{- end }}
{{- end }}
