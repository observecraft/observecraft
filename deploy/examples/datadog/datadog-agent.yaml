# The Datadog Operator's DatadogAgent (Agent + Cluster Agent), sending to ObserveCraft instead of Datadog.
#
#   helm repo add datadog https://helm.datadoghq.com && helm repo update
#   helm install datadog-operator datadog/datadog-operator -n datadog --create-namespace
#   kubectl -n datadog create secret generic datadog-secret --from-literal api-key=<INGEST_API_KEY>
#   kubectl apply -f datadog-agent.yaml
#
# The intake is the in-cluster service, http://observecraft-intake.observecraft.svc:4318:
# replace it everywhere with yours (logs take host:port). With an https intake (through the ingress), drop the
# *_LOGS_NO_SSL variables.
# Generated by scripts/datadog-examples.mjs: Integrations → Kubernetes → Install makes the same for your intake,
# with checkboxes for the optional products.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: "my-cluster"
    # Not a Datadog site: anything left unconfigured has nowhere to send, so no data reaches Datadog.
    site: observecraft.invalid
    # Clusters whose kubelet serves a self-signed certificate (kind, some on-prem setups):
    # kubelet: { tlsVerify: false }
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    # Metrics, metadata, service checks, distributions and the API key check.
    endpoint:
      url: "http://observecraft-intake.observecraft.svc:4318"
  features:
    # APM (8126) and DogStatsD (8125) on each node's IP: DD_AGENT_HOST=status.hostIP in your pods.
    apm:
      enabled: true
      hostPortConfig:
        enabled: true
    dogstatsd:
      hostPortConfig:
        enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    orchestratorExplorer:
      enabled: true
    # Live containers and processes (Infrastructure → Containers, Processes).
    liveContainerCollection:
      enabled: true
    liveProcessCollection:
      enabled: false
    # Workload Protection: the runtime security module and its events. Agent rules come from the
    # policy files mounted in the security agent (Workload Protection → Policies → Download).
    cws:
      enabled: true
    # Cloud Network Monitoring: system-probe's connections and DNS.
    npm:
      enabled: false
    # Sends to Datadog's own intake.
    processDiscovery:
      enabled: false
    # Products ObserveCraft doesn't have yet.
    remoteConfiguration:
      enabled: false
  override:
    nodeAgent:
      env: &env
        - { name: DD_APM_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318" }
        - { name: DD_APM_PROFILING_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318/api/v2/profile" }
        - { name: DD_ORCHESTRATOR_EXPLORER_ORCHESTRATOR_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318" }
        # Live containers and processes (and Cloud Network Monitoring's connections) go to the process intake.
        - { name: DD_PROCESS_CONFIG_PROCESS_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318" }
        - { name: DD_LOGS_CONFIG_LOGS_DD_URL, value: "observecraft-intake.observecraft.svc:4318" }
        - { name: DD_LOGS_CONFIG_FORCE_USE_HTTP, value: "true" }
        - { name: DD_LOGS_CONFIG_LOGS_NO_SSL, value: "true" }
        # Stack traces and other multi-line messages as one log instead of one log per line: the Agent
        # groups lines that don't start a new log (a timestamp it recognises) with the line before. For an
        # application it doesn't get right, a rule on its pod (the pattern of a line that starts a log):
        #   ad.datadoghq.com/<container>.logs: '[{"source":"java","service":"order-service",
        #     "log_processing_rules":[{"type":"multi_line","name":"new_log","pattern":"\\d{4}-\\d{2}-\\d{2}"}]}]'
        - { name: DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION, value: "true" }
        # Tracers' telemetry (the libraries each service loads) feeds Code Security.
        - { name: DD_APM_TELEMETRY_ENABLED, value: "true" }
        - { name: DD_APM_TELEMETRY_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318" }
        - { name: DD_INSTRUMENTATION_TELEMETRY_ENABLED, value: "false" }
        # Software bills of materials of hosts and container images feed Cloud Security's vulnerabilities.
        - { name: DD_SBOM_ENABLED, value: "true" }
        - { name: DD_SBOM_HOST_ENABLED, value: "true" }
        - { name: DD_SBOM_CONTAINER_IMAGE_ENABLED, value: "true" }
        - { name: DD_SBOM_DD_URL, value: "http://observecraft-intake.observecraft.svc:4318" }
        # Workload Protection's events (the runtime security track of the logs pipeline).
        - { name: DD_RUNTIME_SECURITY_CONFIG_ENDPOINTS_LOGS_DD_URL, value: "observecraft-intake.observecraft.svc:4318" }
        - { name: DD_RUNTIME_SECURITY_CONFIG_ENDPOINTS_LOGS_NO_SSL, value: "true" }
        # Products that would send to Datadog's own intakes (not to ObserveCraft): keep them off so nothing
        # leaves for Datadog.
        - { name: DD_PROCESS_CONFIG_PROCESS_DISCOVERY_ENABLED, value: "false" }
        - { name: DD_CONTAINER_IMAGE_ENABLED, value: "false" }
        - { name: DD_CONTAINER_LIFECYCLE_ENABLED, value: "false" }
    clusterAgent:
      env: *env
