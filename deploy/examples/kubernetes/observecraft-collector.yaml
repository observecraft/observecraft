# ObserveCraft for Kubernetes: OpenTelemetry Collectors that send a cluster's logs, metrics and
# objects to an ObserveCraft intake (what the Datadog Agent + Cluster Agent do for Datadog).
#
#   observecraft-agent    DaemonSet, one per node:
#                           container logs (/var/log/pods), Kubernetes metadata on every record,
#                           kubelet CPU / memory per pod and container, node host metrics
#   observecraft-cluster  Deployment, one per cluster:
#                           cluster state (phases, restarts, requests / limits, replicas, node conditions),
#                           Kubernetes objects every minute (Kubernetes Explorer tables and YAML) and events
#
# Before applying, create the secret (see README.md):
#   kubectl create namespace observecraft
#   kubectl -n observecraft create secret generic observecraft \
#     --from-literal=api-key=ocik_… --from-literal=endpoint=https://intake.example.com --from-literal=cluster-name=prod-eu
#
# Logs and metrics are tagged like Datadog's (kube_namespace, pod_name, kube_deployment, …); set the pod
# labels tags.datadoghq.com/service|env|version (or OTEL_SERVICE_NAME) for unified service tagging.
apiVersion: v1
kind: Namespace
metadata:
  name: observecraft
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observecraft-collector
  namespace: observecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observecraft-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, nodes/stats, nodes/proxy, services, endpoints, events, persistentvolumes, persistentvolumeclaims, replicationcontrollers, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  # Read-only inventory for the explorer's Network, Policies, Storage, Access Control and
  # Custom Resources sections (no Secrets or ConfigMaps).
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observecraft-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observecraft-collector
subjects:
  - kind: ServiceAccount
    name: observecraft-collector
    namespace: observecraft
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observecraft-agent
  namespace: observecraft
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        # The collector's own logs would loop back.
        exclude: [/var/log/pods/observecraft_*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          # CRI-O / containerd / Docker formats; sets k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.container.name.
          - type: container
            id: container-parser
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
        metrics:
          k8s.container.cpu_limit_utilization: { enabled: true }
          k8s.container.cpu_request_utilization: { enabled: true }
          k8s.container.memory_limit_utilization: { enabled: true }
          k8s.container.memory_request_utilization: { enabled: true }
          k8s.pod.cpu_limit_utilization: { enabled: true }
          k8s.pod.memory_limit_utilization: { enabled: true }
      hostmetrics:
        root_path: /hostfs
        collection_interval: 20s
        scrapers:
          cpu: { metrics: { system.cpu.utilization: { enabled: true } } }
          memory: { metrics: { system.memory.utilization: { enabled: true } } }
          load: {}
          filesystem:
            include_mount_points: { mount_points: ["/"], match_type: strict }
          network: {}

    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
          labels:
            # Unified service tagging (Datadog) and the standard app labels.
            - { tag_name: "k8s.pod.labels.tags.datadoghq.com/service", key: tags.datadoghq.com/service, from: pod }
            - { tag_name: "k8s.pod.labels.tags.datadoghq.com/env", key: tags.datadoghq.com/env, from: pod }
            - { tag_name: "k8s.pod.labels.tags.datadoghq.com/version", key: tags.datadoghq.com/version, from: pod }
            - { tag_name: "k8s.pod.labels.app.kubernetes.io/name", key: app.kubernetes.io/name, from: pod }
            - { tag_name: "k8s.pod.labels.app.kubernetes.io/instance", key: app.kubernetes.io/instance, from: pod }
            - { tag_name: "k8s.pod.labels.app.kubernetes.io/version", key: app.kubernetes.io/version, from: pod }
            - { tag_name: "k8s.pod.labels.app.kubernetes.io/component", key: app.kubernetes.io/component, from: pod }
            - { tag_name: "k8s.pod.labels.app.kubernetes.io/part-of", key: app.kubernetes.io/part-of, from: pod }
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
          - sources: [{ from: connection }]
      resourcedetection:
        detectors: [env, system]
        override: false
        system: { hostname_sources: [os] }
      resource/cluster:
        attributes:
          - { key: k8s.cluster.name, value: "${env:CLUSTER_NAME}", action: upsert }
          - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: insert }
          - { key: host.name, value: "${env:K8S_NODE_NAME}", action: upsert }
      batch: { send_batch_size: 2000, timeout: 2s }

    exporters:
      otlphttp/observecraft:
        endpoint: ${env:OBSERVECRAFT_ENDPOINT}
        headers:
          authorization: "Bearer ${env:OBSERVECRAFT_API_KEY}"
        compression: gzip
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource/cluster, batch]
          exporters: [otlphttp/observecraft]
        metrics:
          receivers: [kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource/cluster, batch]
          exporters: [otlphttp/observecraft]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: observecraft-agent
  namespace: observecraft
  labels: { app.kubernetes.io/name: observecraft-agent }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: observecraft-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: observecraft-agent }
    spec:
      serviceAccountName: observecraft-collector
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.2
          args: ["--config=/conf/config.yaml"]
          env:
            - { name: K8S_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: K8S_NODE_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - { name: OBSERVECRAFT_API_KEY, valueFrom: { secretKeyRef: { name: observecraft, key: api-key } } }
            - { name: OBSERVECRAFT_ENDPOINT, valueFrom: { secretKeyRef: { name: observecraft, key: endpoint } } }
            - { name: CLUSTER_NAME, valueFrom: { secretKeyRef: { name: observecraft, key: cluster-name } } }
          resources:
            requests: { cpu: 100m, memory: 200Mi }
            limits: { memory: 500Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer }
      volumes:
        - { name: conf, configMap: { name: observecraft-agent } }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: hostfs, hostPath: { path: / } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observecraft-cluster
  namespace: observecraft
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 20s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable]
        allocatable_types_to_report: [cpu, memory, pods]
        metrics:
          k8s.pod.status_reason: { enabled: true }
      k8sobjects:
        auth_type: serviceAccount
        objects:
          # Full objects every minute: the Kubernetes Explorer's tables and YAML tab.
          - { name: pods, mode: pull, interval: 60s }
          - { name: nodes, mode: pull, interval: 60s }
          - { name: namespaces, mode: pull, interval: 60s }
          - { name: services, mode: pull, interval: 60s }
          - { name: deployments, group: apps, mode: pull, interval: 60s }
          - { name: replicasets, group: apps, mode: pull, interval: 60s }
          - { name: daemonsets, group: apps, mode: pull, interval: 60s }
          - { name: statefulsets, group: apps, mode: pull, interval: 60s }
          - { name: jobs, group: batch, mode: pull, interval: 60s }
          - { name: cronjobs, group: batch, mode: pull, interval: 60s }
          - { name: persistentvolumeclaims, mode: pull, interval: 60s }
          - { name: horizontalpodautoscalers, group: autoscaling, mode: pull, interval: 60s }
          - { name: persistentvolumes, mode: pull, interval: 60s }
          - { name: ingresses, group: networking.k8s.io, mode: pull, interval: 60s }
          - { name: networkpolicies, group: networking.k8s.io, mode: pull, interval: 60s }
          - { name: poddisruptionbudgets, group: policy, mode: pull, interval: 60s }
          - { name: limitranges, mode: pull, interval: 60s }
          - { name: resourcequotas, mode: pull, interval: 60s }
          - { name: serviceaccounts, mode: pull, interval: 60s }
          - { name: roles, group: rbac.authorization.k8s.io, mode: pull, interval: 60s }
          - { name: rolebindings, group: rbac.authorization.k8s.io, mode: pull, interval: 60s }
          - { name: clusterroles, group: rbac.authorization.k8s.io, mode: pull, interval: 60s }
          - { name: clusterrolebindings, group: rbac.authorization.k8s.io, mode: pull, interval: 60s }
          - { name: storageclasses, group: storage.k8s.io, mode: pull, interval: 60s }
          - { name: customresourcedefinitions, group: apiextensions.k8s.io, mode: pull, interval: 60s }
          # Kubernetes events as they happen (Events tab).
          - { name: events, group: events.k8s.io, mode: watch }

    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      resource/cluster:
        attributes:
          - { key: k8s.cluster.name, value: "${env:CLUSTER_NAME}", action: upsert }
      # Marks object snapshots so ObserveCraft stores them as inventory, not as log lines.
      resource/objects:
        attributes:
          - { key: oc.signal, value: k8s.objects, action: upsert }
      batch: { send_batch_size: 1000, timeout: 5s }

    exporters:
      otlphttp/observecraft:
        endpoint: ${env:OBSERVECRAFT_ENDPOINT}
        headers:
          authorization: "Bearer ${env:OBSERVECRAFT_API_KEY}"
        compression: gzip
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/observecraft]
        logs/objects:
          receivers: [k8sobjects]
          processors: [memory_limiter, resource/cluster, resource/objects, batch]
          exporters: [otlphttp/observecraft]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observecraft-cluster
  namespace: observecraft
  labels: { app.kubernetes.io/name: observecraft-cluster }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: observecraft-cluster }
  template:
    metadata:
      labels: { app.kubernetes.io/name: observecraft-cluster }
    spec:
      serviceAccountName: observecraft-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.2
          args: ["--config=/conf/config.yaml"]
          env:
            - { name: OBSERVECRAFT_API_KEY, valueFrom: { secretKeyRef: { name: observecraft, key: api-key } } }
            - { name: OBSERVECRAFT_ENDPOINT, valueFrom: { secretKeyRef: { name: observecraft, key: endpoint } } }
            - { name: CLUSTER_NAME, valueFrom: { secretKeyRef: { name: observecraft, key: cluster-name } } }
          resources:
            requests: { cpu: 50m, memory: 150Mi }
            limits: { memory: 400Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - { name: conf, configMap: { name: observecraft-cluster } }
