# Local stand-in for FireLens: Fluent Bit sends ECS-shaped records to the intake on this machine.
#   docker run --rm -e OBSERVECRAFT_API_KEY=ocik_… -v $PWD/local-firelens-test.conf:/fluent-bit/etc/fluent-bit.conf:ro fluent/fluent-bit:3.1.9
[SERVICE]
    Flush        2
    Log_Level    info

[INPUT]
    Name   dummy
    Tag    web-firelens
    Rate   1
    Dummy  {"log":"{\"level\":\"error\",\"msg\":\"payment provider timeout\",\"provider\":\"acmepay\",\"latency_ms\":3012}","source":"stdout","container_name":"/web","container_id":"3f9a2c","ecs_cluster":"arn:aws:ecs:eu-west-1:000000000000:cluster/shop-prod","ecs_task_arn":"arn:aws:ecs:eu-west-1:000000000000:task/shop-prod/0f1e2d3c","ecs_task_definition":"web:17"}

[INPUT]
    Name   dummy
    Tag    web-firelens
    Rate   2
    Dummy  {"log":"GET /api/products 200 23ms","source":"stdout","container_name":"/web","container_id":"3f9a2c","ecs_cluster":"arn:aws:ecs:eu-west-1:000000000000:cluster/shop-prod","ecs_task_arn":"arn:aws:ecs:eu-west-1:000000000000:task/shop-prod/0f1e2d3c","ecs_task_definition":"web:17"}

[OUTPUT]
    Name         http
    Match        *
    Host         host.docker.internal
    Port         4318
    URI          /api/v2/logs
    Format       json
    json_date_key date
    json_date_format iso8601
    Header       authorization Bearer ${OBSERVECRAFT_API_KEY}
