# OpenTelemetry Collector (gateway). Applications send OTLP here.
#   logs            → Vector aggregator (single normalization point, same path as agent logs)
#   traces, metrics → ClickHouse `otel` database via the contrib ClickHouse exporter (schema auto-created)
#   CI/CD traces    → `otel.otel_ci_traces` (any trace whose resource has cicd.pipeline.name), kept 30 days
#   hostmetrics     → the machine running this collector (the Docker VM locally), as a regular host
receivers:
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: { enabled: true }
      load: {}
      memory:
        metrics:
          system.memory.utilization: { enabled: true }
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict
      network: {}
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  resourcedetection:
    detectors: [env, system]
    # Keep host.name etc. sent by the application; only fill in what is missing.
    override: false
  batch: {}
  # hostmetrics reports CPU per core; dashboards want one series per host and state (like the
  # per-host values other agents send), so average across cores before export.
  metricstransform/cpu:
    transforms:
      - include: system.cpu.utilization
        action: update
        operations:
          - { action: aggregate_labels, label_set: [state], aggregation_type: mean }
      - include: system.cpu.time
        action: update
        operations:
          - { action: aggregate_labels, label_set: [state], aggregation_type: sum }
  # Identity of the collector's own host (OC_HOST_NAME in compose) for hostmetrics only.
  resource/host:
    attributes:
      - { key: host.name, value: "${env:OC_HOST_NAME}", action: upsert }
      - { key: deployment.environment, value: dev, action: upsert }
      - { key: observecraft.collector, value: otel, action: upsert }
      - { key: observecraft.collector.version, value: otelcol-contrib 0.112.0, action: upsert }
      - { key: os.type, value: linux, action: upsert }

connectors:
  # CI/CD pipeline runs arrive as traces (pipeline → jobs → steps/tests) using the OTel cicd.* and
  # vcs.* attributes. They get their own table so they don't show up as APM services.
  routing/ci:
    default_pipelines: [traces/apm]
    error_mode: ignore
    table:
      - statement: route() where attributes["cicd.pipeline.name"] != nil
        pipelines: [traces/ci]

exporters:
  otlp/vector:
    endpoint: vector-aggregator:4317
    tls:
      insecure: true
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 72h
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue:
      queue_size: 1000
  clickhouse/ci:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    traces_table_name: otel_ci_traces
    ttl: 720h
    timeout: 10s
    retry_on_failure:
      enabled: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/vector]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [routing/ci]
    traces/apm:
      receivers: [routing/ci]
      exporters: [clickhouse]
    traces/ci:
      receivers: [routing/ci]
      exporters: [clickhouse/ci]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [clickhouse]
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, metricstransform/cpu, resource/host, batch]
      exporters: [clickhouse]
