# OpenTelemetry Collector (internal). Senders reach it only through oc-intake, which authenticates
# the ingest key and adds the `x-oc-org` header; `resource/org` turns that into the `oc.org_id`
# resource attribute every table is filtered by (a client-sent oc.org_id is always replaced).
#
# Input: Kafka (docs/adr/0004-kafka-ingestion-buffer.md): the intake writes each request to a topic,
# with its headers as record headers, which the Kafka receivers pass on as request metadata (the same
# `metadata.x-oc-org` as over HTTP). A record is marked consumed only once the pipeline accepted it,
# i.e. once the exporters' file-backed queues hold it: batching happens in those queues, not in a
# batch processor (which would accept records before they are persisted). The OTLP receiver stays for
# an intake running without Kafka (OC_KAFKA_BROKERS unset).
#   logs            → Vector aggregator (single normalization point, same path as agent logs)
#   traces, metrics → ClickHouse `otel` database via the contrib ClickHouse exporter (tables owned by
#                     the server's ClickHouse migrations, hence create_schema: false)
#   CI/CD traces    → `otel.otel_ci_traces` (any trace whose resource has cicd.pipeline.name), kept 30 days
#
# Endpoints come from the environment (defaults: the compose service names); the Helm chart mounts
# this same file. hostmetrics.yaml adds the collector's own host metrics in compose.
receivers:
  kafka/otlp:
    brokers: ["${env:OC_KAFKA_BROKERS:-kafka:9092}"]
    group_id: oc-collector
    client_id: oc-collector
    # A new consumer group starts from the oldest data Kafka still has: nothing accepted is skipped.
    initial_offset: earliest
    message_marking: { after: true, on_error: false }
    # A record the pipeline refused (the export queue full, ClickHouse down long enough) is retried
    # instead of pausing its partition until a rebalance.
    error_backoff: { enabled: true, initial_interval: 1s, max_interval: 30s }
    # Each partition in its own worker, several requests in flight: waiting for the queue on one
    # partition doesn't hold the others (ordering within an org isn't needed for telemetry).
    partition_processing: { independent: true, max_buffered_batches: 4, max_in_flight: { records: 8 } }
    traces: { topics: [oc.otlp.traces], encoding: otlp_proto }
    metrics: { topics: [oc.otlp.metrics], encoding: otlp_proto }
    logs: { topics: [oc.otlp.logs], encoding: otlp_proto }
  kafka/otlp_json:
    brokers: ["${env:OC_KAFKA_BROKERS:-kafka:9092}"]
    group_id: oc-collector-json
    client_id: oc-collector-json
    initial_offset: earliest
    message_marking: { after: true, on_error: false }
    # A record the pipeline refused (the export queue full, ClickHouse down long enough) is retried
    # instead of pausing its partition until a rebalance.
    error_backoff: { enabled: true, initial_interval: 1s, max_interval: 30s }
    # Each partition in its own worker, several requests in flight: waiting for the queue on one
    # partition doesn't hold the others (ordering within an org isn't needed for telemetry).
    partition_processing: { independent: true, max_buffered_batches: 4, max_in_flight: { records: 8 } }
    traces: { topics: [oc.otlp-json.traces], encoding: otlp_json }
    metrics: { topics: [oc.otlp-json.metrics], encoding: otlp_json }
    logs: { topics: [oc.otlp-json.logs], encoding: otlp_json }
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OC_COLLECTOR_MEMORY_LIMIT_MIB:-512}
  resourcedetection:
    detectors: [env, system]
    # Keep host.name etc. sent by the application; only fill in what is missing.
    override: false
  # The tenant: from oc-intake's header only. Without it (nothing should reach us that way) the data
  # has no organization and is visible to no one.
  resource/org:
    attributes:
      - { key: oc.org_id, action: delete }
      - { key: oc.org_id, from_context: metadata.x-oc-org, action: upsert }
      # The org's span retention in days (the spans table TTL reads it).
      - { key: oc.retention_days, action: delete }
      - { key: oc.retention_days, from_context: metadata.x-oc-retention-days, action: upsert }
      # The org's metric retention: full resolution, 5-minute and 1-hour rollups (the metric tables
      # partition by them).
      - { key: oc.metrics_retention_days, action: delete }
      - { key: oc.metrics_retention_days, from_context: metadata.x-oc-metrics-retention-days, action: upsert }
      - { key: oc.metrics_retention_5m_days, action: delete }
      - { key: oc.metrics_retention_5m_days, from_context: metadata.x-oc-metrics-retention-5m-days, action: upsert }
      - { key: oc.metrics_retention_1h_days, action: delete }
      - { key: oc.metrics_retention_1h_days, from_context: metadata.x-oc-metrics-retention-1h-days, action: upsert }
      # Metrics whose series the intake already forwarded in their hour (x-oc-series-known: 1): the
      # series table skips them (docs/adr/0002-storage-at-saas-scale.md).
      - { key: oc.series_known, action: delete }
      - { key: oc.series_known, from_context: metadata.x-oc-series-known, action: upsert }
connectors:
  # Kubernetes object snapshots and events (the cluster collector marks them oc.signal = k8s.objects)
  # are inventory for the Kubernetes Explorer, not log lines.
  routing/logs:
    default_pipelines: [logs/app]
    error_mode: ignore
    table:
      - statement: route() where attributes["oc.signal"] == "k8s.objects"
        pipelines: [logs/k8s]
      # Events (Datadog Agent events, the events API) → otel.otel_events.
      - statement: route() where attributes["oc.signal"] == "dd.events"
        pipelines: [logs/events]
      # Network connections (Datadog system-probe) → otel.otel_network.
      - statement: route() where attributes["oc.signal"] == "dd.connections"
        pipelines: [logs/network]
      # Real User Monitoring events (browser and mobile SDKs) → otel.otel_rum.
      - statement: route() where attributes["oc.signal"] == "dd.rum"
        pipelines: [logs/rum]
      # Session Replay segments (browser SDK) → otel.otel_rum_replay.
      - statement: route() where attributes["oc.signal"] == "dd.replay"
        pipelines: [logs/replay]
  # CI/CD pipeline runs arrive as traces (pipeline → jobs → steps/tests) using the OTel cicd.* and
  # vcs.* attributes. They get their own table so they don't show up as APM services.
  routing/ci:
    default_pipelines: [traces/apm]
    error_mode: ignore
    table:
      - statement: route() where attributes["cicd.pipeline.name"] != nil
        pipelines: [traces/ci]

exporters:
  otlp/vector:
    endpoint: ${env:OC_VECTOR_OTLP_ENDPOINT:-vector-aggregator:4317}
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      storage: file_storage/queue
      sizer: items
      queue_size: 5000000
      batch: { flush_timeout: 1s, min_size: 10000, max_size: 50000 }
  clickhouse:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    ttl: 72h
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: &queue
      storage: file_storage/queue
      # Every batch becomes one INSERT, i.e. one new part per table. Small batches mean several new
      # parts a second per table, and merging them takes ClickHouse's CPU and memory.
      sizer: items
      queue_size: 5000000
      batch: { flush_timeout: 5s, min_size: 50000, max_size: 100000 }
  # Metrics: the ingest tables of the metrics storage (series and samples, built by materialized
  # views; rollups by the server's rollup job, docs/adr/0001-metrics-storage.md and 0002).
  clickhouse/metrics:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    timeout: 10s
    metrics_tables:
      gauge: { name: metrics_ingest_gauge }
      sum: { name: metrics_ingest_sum }
      summary: { name: metrics_ingest_summary }
      histogram: { name: metrics_ingest_histogram }
      exponential_histogram: { name: metrics_ingest_exponential_histogram }
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/k8s:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_k8s_objects
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/events:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_events
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/network:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_network
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/rum:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_rum
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/replay:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_rum_replay
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue
  clickhouse/ci:
    endpoint: ${env:OC_CLICKHOUSE_TCP_ENDPOINT:-tcp://clickhouse:9000?dial_timeout=10s}
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    traces_table_name: otel_ci_traces
    ttl: 720h
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue: *queue

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Persistent export queue (the volume collector-queue): telemetry waiting for ClickHouse is kept
  # on disk, not in memory.
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true

service:
  extensions: [health_check, file_storage/queue]
  pipelines:
    logs:
      receivers: [kafka/otlp, kafka/otlp_json, otlp]
      processors: [memory_limiter, resource/org, resourcedetection]
      exporters: [routing/logs]
    logs/app:
      receivers: [routing/logs]
      exporters: [otlp/vector]
    logs/k8s:
      receivers: [routing/logs]
      exporters: [clickhouse/k8s]
    logs/events:
      receivers: [routing/logs]
      exporters: [clickhouse/events]
    logs/network:
      receivers: [routing/logs]
      exporters: [clickhouse/network]
    logs/rum:
      receivers: [routing/logs]
      exporters: [clickhouse/rum]
    logs/replay:
      receivers: [routing/logs]
      exporters: [clickhouse/replay]
    traces:
      receivers: [kafka/otlp, kafka/otlp_json, otlp]
      processors: [memory_limiter, resource/org, resourcedetection]
      exporters: [routing/ci]
    traces/apm:
      receivers: [routing/ci]
      exporters: [clickhouse]
    traces/ci:
      receivers: [routing/ci]
      exporters: [clickhouse/ci]
    metrics:
      receivers: [kafka/otlp, kafka/otlp_json, otlp]
      processors: [memory_limiter, resource/org, resourcedetection]
      exporters: [clickhouse/metrics]
