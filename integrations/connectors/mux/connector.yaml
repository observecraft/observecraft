    - { url: "https://api.mux.com/data/v1/metrics/views/breakdown", query: { group_by: video_id }, file: fixtures/views-video.json }
    - { url: "https://api.mux.com/data/v1/metrics/video_startup_time/breakdown", file: fixtures/video_startup_time-video.json }
    - { url: "https://api.mux.com/data/v1/metrics/views/overall", body: { data: { value: 1820, total_views: 1820, total_watch_time: 513934000, total_playing_time: 413934000 }, timeframe: [1794225600, 1794312000], total_row_count: null } }
    # The other metrics answer an empty breakdown in the replay.
    - { url: "https://api.mux.com/data/v1/metrics/aggregate_startup_time/breakdown", body: { data: [], total_row_count: 0 } }
