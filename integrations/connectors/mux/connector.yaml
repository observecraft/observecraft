    - { url: "https://api.mux.com/data/v1/metrics/rebuffer_duration/breakdown", body: { data: [], total_row_count: 0 } }
    - { url: "https://api.mux.com/data/v1/metrics/rebuffer_frequency/breakdown", body: { data: [], total_row_count: 0 } }
    - { url: "https://api.mux.com/data/v1/metrics/rebuffer_percentage/breakdown", body: { data: [], total_row_count: 0 } }
