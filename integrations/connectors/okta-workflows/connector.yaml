# yaml-language-server: $schema=../connector.schema.json
# Okta Workflows (https://developer.okta.com/docs/api/openapi/okta-management/management/tag/SystemLog/): the
# Workflows events of an Okta org's System Log (event types starting with `workflows.`), as the logs Datadog's
# integration sends (source:okta-workflows, service:workflows, the System Log event under `log` and the flow it is
# about under `enrichment_details`). integrations-core's Okta Workflows pipeline, dashboard and monitors read them as
# they are, so this package ships none: saving a connection installs the tile's.
schema_version: 1
id: okta-workflows
name: Okta Workflows
publisher: ObserveCraft
vendor: Okta
description: >-
  Okta Workflows events (flows created, activated, run, deactivated; connections created, reauthorized and revoked;
  tables and folders changed) as logs, read every minute from the Okta org's System Log API.
tiles: [okta-workflows]
categories: [Log Collection, Security, Automation]
docs_url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/SystemLog/
setup: |
  1. In the Okta Admin Console, sign in as (or create) an admin with the **Read-only Administrator** role, e.g. a
     dedicated `observecraft-reader` account.
  2. Open **Security → API → Tokens**, **Create Token**, name it `ObserveCraft` and copy its value (Okta shows it once).
     The token acts as that admin: it can read the System Log, nothing more.
  3. Enter your Okta domain (`example.okta.com`, or your custom domain).
instance: "{{ config.domain }}"

config:
  - key: domain
    label: Okta domain
    type: string
    required: true
    pattern: "[A-Za-z0-9.-]+"
    placeholder: example.okta.com
    help: The org's domain, without https://.
  - key: api_token
    label: API token
    type: string
    secret: true
    required: true
    help: An API token created by a Read-only Administrator.

auth:
  kind: api_key
  name: Authorization
  value: "SSWS {{ secrets.api_token }}"

# The System Log API has its own org-wide rate limit (60 requests a minute on the smallest plans).
rate_limit: { requests_per_minute: 30 }

errors:
  - status: [401]
    kind: auth
    message: Okta refused the API token (expired, revoked, or its admin was deactivated)
  - status: [403]
    kind: access_denied
    message: The API token's admin can't read the System Log (give it the Read-only Administrator role)
  - status: [429]
    kind: throttled
    message: "Okta's System Log rate limit is used up (resets at {{ headers['x-rate-limit-reset'] ?? '?' }})"

streams:
  - id: workflow_events
    name: Workflows events
    description: >-
      Every System Log event whose type starts with workflows. as a log (service:workflows): the event under log
      (eventType, displayMessage, actor, client, outcome, target), the flow it is about under enrichment_details
      (workflow_id, workflow_name).
    request:
      url: "https://{{ config.domain }}/api/v1/logs"
      query:
        since: "{{ window.start | rfc3339 }}"
        until: "{{ window.end | rfc3339 }}"
        filter: 'eventType sw "workflows."'
        sortOrder: ASCENDING
        limit: 1000
    pagination: { kind: link_header }
    record_id: "{{ record.uuid }}"
    incremental:
      kind: time
      record_time: "{{ record.published }}"
      order: oldest_first
      lookback: 1d
      overlap: 2m
      # The System Log is eventually consistent: events can show up a few seconds late.
      settle: 30s
    vars:
      flow: "{{ (record.target ?? []) | where('type', 'Flow') | first }}"
    output:
      logs:
        service: workflows
        message: "{{ record.displayMessage ?? record.eventType }}"
        status: >-
          {{ record.outcome.result in ['FAILURE', 'DENY'] ? 'error' : record.severity == 'WARN' ? 'warn' : record.severity == 'ERROR' ? 'error' : 'info' }}
        date: "{{ record.published }}"
        attributes:
          log: "{{ record }}"
          enrichment_details:
            workflow_id: "{{ vars.flow.id }}"
            workflow_name: "{{ vars.flow.displayName }}"

test:
  request:
    url: "https://{{ config.domain }}/api/v1/logs"
    query: { filter: 'eventType sw "workflows."', limit: 1 }
  message: "Connected to {{ config.domain }}: the System Log is readable"

mock:
  config: { domain: example.okta.com }
  secrets: { api_token: 00okta-test-token }
  now: "2026-11-10T12:00:00Z"
  responses:
    - { url: "https://example.okta.com/api/v1/logs", query: { limit: "1" }, body: [] }
    - { url: "https://example.okta.com/api/v1/logs", query: { after: "1794310000000_1" }, body: [] }
    - { url: "https://example.okta.com/api/v1/logs", file: fixtures/logs.json, headers: { Link: '<https://example.okta.com/api/v1/logs?after=1794310000000_1&limit=1000>; rel="next"' } }
  expect:
    workflow_events: { records: 3, logs: 3, rerun: 0, golden: fixtures/workflow_events.expected.json }
    test: { ok: true, message: "System Log is readable" }
