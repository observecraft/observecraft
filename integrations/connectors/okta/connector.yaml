# yaml-language-server: $schema=../connector.schema.json
# Okta (https://developer.okta.com/docs/api/openapi/okta-management/management/tag/SystemLog/): an org's System Log,
# as the logs Datadog's Okta integration sends (source:okta, Okta's LogEvent fields at the top level, plus the standard
# evt.*, usr.* and network.client.* attributes the Okta Cloud SIEM pack reads). Datadog has no integrations-core tile
# for it (its Okta integration is collected by its own service), so the package adds its own tile, with our dashboard.
schema_version: 1
id: okta
name: Okta
publisher: ObserveCraft
vendor: Okta
description: >-
  An Okta org's System Log (sign-ins, MFA, password and session events, admin changes, app assignments, policy
  evaluations) as logs, read every minute through Okta's System Log API.
logo: okta
categories: [Security, SIEM, Log Collection]
docs_url: https://developer.okta.com/docs/reference/system-log-query/
setup: |
  1. Enter your org's Okta domain (`example.okta.com`, `example.okta-emea.com` or a custom domain) and choose how
     ObserveCraft signs in:
     - **OAuth service app** (recommended): in the Admin Console, **Applications → Create App Integration → API
       Services**, e.g. `observecraft`. Under **Client Credentials** choose **Public key / Private key** and add a key
       (Okta can generate one: copy its private key in PEM format and its key id), and turn off **Require
       Demonstrating Proof of Possession (DPoP)**. On **Okta API Scopes** grant `okta.logs.read`, and on **Admin
       roles** assign the **Read-Only Administrator** role. Copy the client id.
     - **API token**: sign in as (or create) an administrator with the **Read-Only Administrator** role, open
       **Security → API → Tokens** and **Create token**; copy it, Okta shows it once. A token unused for 30 days
       expires, and its requests share the administrator's rate limits.
links:
  - { label: API tokens, url: "https://{{ config.domain }}/admin/access/api/tokens" }
instance: "{{ config.domain }}"

config:
  - key: domain
    label: Okta domain
    type: string
    required: true
    placeholder: example.okta.com
    pattern: "[A-Za-z0-9.-]+"
    help: Your org's domain without https:// (example.okta.com, example.oktapreview.com or a custom domain).
  - key: auth_method
    label: Sign in with
    type: select
    required: true
    default: token
    options:
      - { value: oauth, label: OAuth service app }
      - { value: token, label: API token }
  - key: api_token
    label: API token
    type: string
    secret: true
    help: "API token: a Read-Only Administrator's."
  - key: client_id
    label: Client ID
    type: string
    placeholder: 0oa1b2c3d4e5f6g7h8i9
    help: "OAuth service app: its client id."
  - key: key_id
    label: Key ID
    type: string
    help: "OAuth service app: the public key's id (kid), when the app has several keys."
  - key: private_key
    label: Private key
    type: text
    secret: true
    placeholder: "-----BEGIN PRIVATE KEY-----"
    help: "OAuth service app: the private key (PEM) of its public key."

auth:
  kind: choice
  field: auth_method
  options:
    token: { kind: api_key, name: Authorization, value: "SSWS {{ secrets.api_token }}" }
    # A service app: a client assertion signed with its key (private_key_jwt) for an hour-long access token.
    oauth:
      kind: oauth2_client_assertion
      token_url: "https://{{ config.domain }}/oauth2/v1/token"
      client_id: "{{ config.client_id }}"
      private_key: "{{ secrets.private_key }}"
      key_id: "{{ config.key_id }}"
      scopes: [okta.logs.read]

headers:
  Accept: application/json

# The System Log's own limit is per org (60 to 120 requests a minute by plan); leave room for the customer's tools.
rate_limit: { requests_per_minute: 30 }

errors:
  - status: [401]
    kind: auth
    message: Okta refused the credentials (an API token revoked, expired after 30 days unused or for another org; a service app's client id or key)
  - status: [403]
    kind: access_denied
    message: "Okta refused to read the System Log: give the token's administrator (or the service app) the Read-Only Administrator role, and the app the okta.logs.read scope"
  - status: [429]
    kind: throttled
    message: "Rate limited by Okta (resets at {{ headers['x-rate-limit-reset'] ?? '?' }})"

streams:
  - id: system_log
    name: System Log
    description: >-
      Every System Log event as a log (source:okta, service:okta): evt.name is the eventType, evt.outcome the
      outcome's result, usr.* the actor, network.client.* the client's IP and location. Failures and denials are
      warnings, Okta's ERROR severity errors.
    # A bounded query (since and until) in ascending order: Okta's Link header stops at the window's end.
    request:
      url: "https://{{ config.domain }}/api/v1/logs"
      query:
        since: "{{ window.start | rfc3339 }}"
        until: "{{ window.end | rfc3339 }}"
        sortOrder: ASCENDING
        limit: 1000
    pagination: { kind: link_header }
    max_pages: 30
    record_id: "{{ record.uuid }}"
    incremental:
      kind: time
      record_time: "{{ record.published }}"
      order: oldest_first
      lookback: 1d
      # Okta is eventually consistent: events can be listed a minute or two after their time.
      overlap: 5m
      settle: 30s
    vars:
      outcome: "{{ record.outcome.result }}"
    output:
      logs:
        service: okta
        message: "{{ record.displayMessage ?? record.eventType }}"
        status: >-
          {{ record.severity == 'ERROR' ? 'error'
             : (record.severity == 'WARN' || vars.outcome in ['FAILURE', 'DENY']) ? 'warn'
             : 'info' }}
        date: "{{ record.published }}"
        attributes: >-
          {{ record + {
               evt: {name: record.eventType, outcome: vars.outcome},
               usr: {id: record.actor.id, email: record.actor.alternateId, name: record.actor.displayName},
               network: {client: {ip: record.client.ipAddress, geoip: record.client.geographicalContext}},
               http: {useragent: record.client.userAgent.rawUserAgent}
             } }}

test:
  request:
    url: "https://{{ config.domain }}/api/v1/logs"
    query: { limit: 1, since: "{{ (now - 3600000) | rfc3339 }}" }
  message: "Connected to {{ config.domain }}: {{ config.auth_method == 'oauth' ? 'the service app' : 'the token' }} can read the System Log"

assets:
  dashboards: [assets/dashboards/overview.json]

