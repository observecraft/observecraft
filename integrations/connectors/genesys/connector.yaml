            genesys_cloud.message.dialing_time_avg, genesys_cloud.message.flow_out_time_avg,
            genesys_cloud.message.handle_time_avg, genesys_cloud.message.held_complete_time_avg,
            genesys_cloud.message.ivr_time_avg, genesys_cloud.message.monitoring_complete_time_avg,
            genesys_cloud.message.not_responding_time_avg, genesys_cloud.message.talk_complete_time_avg,
            genesys_cloud.message.user_response_time_avg, genesys_cloud.message.wait_time_avg,
            genesys_cloud.voice.abandoned_conversation_time_avg, genesys_cloud.voice.acw_time_avg,
            genesys_cloud.voice.alert_time_avg, genesys_cloud.voice.answered_time_avg,
            genesys_cloud.voice.barged_conversations_time_avg, genesys_cloud.voice.coached_conversations_time_avg,
            genesys_cloud.voice.connected_time_avg, genesys_cloud.voice.contacting_time_avg,
            genesys_cloud.voice.dialing_time_avg, genesys_cloud.voice.flow_out_time_avg,
            genesys_cloud.voice.handle_time_avg, genesys_cloud.voice.held_complete_time_avg,
            genesys_cloud.voice.ivr_time_avg, genesys_cloud.voice.monitoring_complete_time_avg,
            genesys_cloud.voice.not_responding_time_avg, genesys_cloud.voice.short_abandoned_conversations_time_avg,
            genesys_cloud.voice.talk_complete_time_avg, genesys_cloud.voice.voicemail_time_avg,
            genesys_cloud.voice.wait_time_avg]
          type: count
          each: "{{ record.data.metrics }}"
          value: "{{ entry.stats.sum / entry.stats.count }}"
          time: "{{ record.data.interval | split('/') | first }}"
          unit: millisecond
          description: The interval's average duration, per metric.
        - name: "{{ (vars.prefix + tables.times[entry.metric] + '_time_max') ?? '' }}"
          examples: [genesys_cloud.callback.active_callback_complete_time_max, genesys_cloud.callback.acw_time_max,
            genesys_cloud.callback.alert_time_max, genesys_cloud.callback.answered_time_max,
            genesys_cloud.callback.barged_conversations_time_max,
            genesys_cloud.callback.coached_conversations_time_max, genesys_cloud.callback.connected_time_max,
            genesys_cloud.callback.contacting_time_max, genesys_cloud.callback.dialing_time_max,
