test:
  request: { url: "https://api.{{ config.region }}/api/v2/audits/query/servicemapping" }
  success: "{{ response.services }}"
  message: "Connected: {{ response.services | len }} audit services to read"

mock:
  config: { region: mypurecloud.ie, client_id: 6a1b0c2d-0000-4000-8000-000000000001, media_types: [voice, chat] }
  secrets: { client_secret: genesys-test-secret }
  now: "2026-11-10T12:00:00Z"
  responses:
    - { method: POST, url: "https://login.mypurecloud.ie/oauth/token", body: { access_token: genesys-test-token, token_type: bearer, expires_in: 86399 } }
    - { url: "https://api.mypurecloud.ie/api/v2/audits/query/servicemapping", file: fixtures/servicemapping.json }
    - { method: POST, url: "https://api.mypurecloud.ie/api/v2/audits/query/realtime", body_contains: '"serviceName":"Architect"', file: fixtures/audits-architect.json }
    - { method: POST, url: "https://api.mypurecloud.ie/api/v2/audits/query/realtime", body_contains: '"serviceName":"Directory"', file: fixtures/audits-directory.json }
    - { method: POST, url: "https://api.mypurecloud.ie/api/v2/audits/query/realtime", file: fixtures/audits-empty.json }
    - { method: POST, url: "https://api.mypurecloud.ie/api/v2/analytics/conversations/aggregates/query", body_contains: '"value":"voice"', file: fixtures/aggregates-voice.json }
    - { method: POST, url: "https://api.mypurecloud.ie/api/v2/analytics/conversations/aggregates/query", body_contains: '"value":"chat"', file: fixtures/aggregates-chat.json }
  expect:
    audits: { records: 3, logs: 3, rerun: 0, golden: fixtures/audits.expected.json }
    conversations: { records: 3, rerun: 0, golden: fixtures/conversations.expected.json }
    test: { ok: true, message: "3 audit services" }
