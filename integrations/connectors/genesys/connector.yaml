            genesys_cloud.message.over_sla_count, genesys_cloud.message.state_transition_errors_count,
            genesys_cloud.message.talk_complete_count, genesys_cloud.message.total_conversations,
            genesys_cloud.message.total_transferred_count, genesys_cloud.message.user_response_count,
            genesys_cloud.message.wait_count, genesys_cloud.voice.abandoned_conversation_count,
            genesys_cloud.voice.abandoned_outbound_conversations_count, genesys_cloud.voice.acw_count,
            genesys_cloud.voice.alert_count, genesys_cloud.voice.answered_count,
            genesys_cloud.voice.attempted_outbound_conversations_count,
            genesys_cloud.voice.barged_conversations_count, genesys_cloud.voice.blind_transferred_count,
            genesys_cloud.voice.bot_interactions_count, genesys_cloud.voice.coached_conversations_count,
            genesys_cloud.voice.connected_conversations_count,
            genesys_cloud.voice.connected_outbound_conversations_count,
            genesys_cloud.voice.consult_transferred_conversations_count,
            genesys_cloud.voice.consulted_conversations_count, genesys_cloud.voice.contacting_count,
            genesys_cloud.voice.dialing_count, genesys_cloud.voice.errored_conversations_count,
            genesys_cloud.voice.flow_out_count, genesys_cloud.voice.handle_count,
            genesys_cloud.voice.held_complete_count, genesys_cloud.voice.ivr_count,
