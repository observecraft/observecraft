            genesys_cloud.email.over_sla_count, genesys_cloud.email.park_complete_count,
            genesys_cloud.email.state_transition_errors_count, genesys_cloud.email.talk_complete_count,
            genesys_cloud.email.total_conversations, genesys_cloud.email.total_transferred_count,
            genesys_cloud.email.user_response_count, genesys_cloud.email.wait_count,
            genesys_cloud.message.agent_response_count, genesys_cloud.message.alert_count,
            genesys_cloud.message.answered_count, genesys_cloud.message.attempted_outbound_conversations_count,
            genesys_cloud.message.barged_conversations_count, genesys_cloud.message.blind_transferred_count,
            genesys_cloud.message.bot_interactions_count, genesys_cloud.message.coached_conversations_count,
            genesys_cloud.message.connected_conversations_count,
            genesys_cloud.message.connected_outbound_conversations_count,
            genesys_cloud.message.consult_transferred_conversations_count,
            genesys_cloud.message.consulted_conversations_count, genesys_cloud.message.contacting_count,
            genesys_cloud.message.dialing_count, genesys_cloud.message.errored_conversations_count,
            genesys_cloud.message.flow_out_count, genesys_cloud.message.handle_count,
            genesys_cloud.message.held_complete_count, genesys_cloud.message.ivr_count,
            genesys_cloud.message.monitoring_complete_count, genesys_cloud.message.not_responding_count,
