            genesys_cloud.chat.connected_time_avg, genesys_cloud.chat.contacting_time_avg,
            genesys_cloud.chat.dialing_time_avg, genesys_cloud.chat.flow_out_time_avg,
            genesys_cloud.chat.handle_time_avg, genesys_cloud.chat.held_complete_time_avg,
            genesys_cloud.chat.ivr_time_avg, genesys_cloud.chat.monitoring_complete_time_avg,
            genesys_cloud.chat.not_responding_time_avg, genesys_cloud.chat.short_abandoned_conversations_time_avg,
            genesys_cloud.chat.talk_complete_time_avg, genesys_cloud.chat.wait_time_avg,
            genesys_cloud.email.acw_time_avg, genesys_cloud.email.agent_response_time_avg,
            genesys_cloud.email.alert_time_avg, genesys_cloud.email.answered_time_avg,
            genesys_cloud.email.barged_conversations_time_avg, genesys_cloud.email.coached_conversations_time_avg,
