# yaml-language-server: $schema=../connector.schema.json
# Modal (https://modal.com/docs/guide/otel-integration): push-only. Modal has no API to read logs or metrics back; its
# OpenTelemetry integration pushes a workspace's Function logs, audit logs and container metrics over OTLP/HTTP
# (protobuf) to a provider's base URL with headers from a Modal Secret (`OTEL_HEADER_<name>`). The metric names it
# lists are the modal.* ones of Datadog's Modal integration (metadata.csv), so the tile's dashboard reads them.
# Logs arrive as OpenTelemetry logs, not with `source:modal`: integrations-extras' Modal pipeline (filter source:modal)
# doesn't apply to them unless the logs carry that source.
schema_version: 1
id: modal
name: Modal
publisher: ObserveCraft
vendor: Modal Labs
description: >-
  A Modal workspace's Function logs, audit logs and container metrics (CPU, memory, GPUs, containers, inputs), pushed
  by Modal's OpenTelemetry integration.
tiles: [modal]
categories: [Cloud, AI/ML, Metrics, Log Collection]
source: modal
docs_url: https://modal.com/docs/guide/otel-integration

push:
  kind: otlp
  url: "{{ intake }}"
  headers: { DD-API-KEY: "{{ api_key }}" }
  instructions: |
    1. In Modal, open **Secrets → Create new secret → Custom** and add one key, `OTEL_HEADER_DD-API-KEY`, with the value
       `{{ api_key }}`. Name the secret, e.g. `observecraft-otel`.
    2. Open [Settings → Metrics](https://modal.com/settings/metrics), choose **OpenTelemetry**, enter the push URL
       `{{ intake }}` (the base URL: Modal adds `/v1/logs` and `/v1/metrics`) and pick the secret from step 1.
    3. **Test** the connection: a test log appears in Logs, then Function logs, audit logs and the `modal.*` metrics
       (tagged app_name, function_name, environment_name, workspace_name, container_id) every minute.
