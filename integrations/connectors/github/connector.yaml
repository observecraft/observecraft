# yaml-language-server: $schema=../connector.schema.json
# GitHub (https://docs.github.com/en/rest): an organization's audit log (GitHub Enterprise Cloud) as the logs
# Datadog's GitHub integration sends (source:github, GitHub's audit fields at the top level: action, actor, repo,
# visibility, which the GitHub Cloud SIEM pack reads), the enterprise's audit log with an enterprise owner's token,
# and the open code scanning, Dependabot and secret scanning alerts as gauges. Datadog has no integrations-core tile
# for it, so the package adds its own tile and dashboard. The organization is read with a GitHub App (a JWT
# exchanged for an installation token) or an organization owner's personal access token; the enterprise audit log,
# which GitHub Apps can't read, with a classic personal access token. GitHub Enterprise can also stream its audit log
# to the intake's Splunk HEC endpoint (push). The alert gauges' names are ours: Datadog doesn't list its own.
schema_version: 1
id: github
name: GitHub
publisher: ObserveCraft
vendor: GitHub
description: >-
  A GitHub organization's audit log (repositories, members, teams, permissions, settings, Actions, tokens) and its
  enterprise's audit log as logs, and the open code scanning, Dependabot and secret scanning alerts as metrics.
logo: github
categories: [Source Control, Security, SIEM, Developer Tools]
docs_url: https://docs.github.com/en/rest/orgs/orgs#get-the-audit-log-for-an-organization
setup: |
  1. Choose how ObserveCraft signs in:
     - **GitHub App** (recommended): create an app owned by the organization (**Settings → Developer settings →
       GitHub Apps → New GitHub App**), e.g. `observecraft`, without a webhook, with the organization permission
       **Administration: Read** (the audit log) and the repository permissions **Code scanning alerts**,
       **Dependabot alerts** and **Secret scanning alerts: Read**. **Generate a private key** (a `.pem` file) and
       note the App ID; install the app on the organization (all repositories) and note the installation id from
       the installation's URL.
     - **Personal access token**: an organization owner creates a classic token with `read:audit_log`, `read:org`
       and `security_events` (or a fine-grained token on the organization with the same read permissions as the
       app above).
  2. The audit log needs GitHub Enterprise Cloud. For the enterprise's audit log, an enterprise owner creates a
     classic token with `read:audit_log` and turns on **Enterprise audit log** below.
links:
  - { label: New GitHub App, url: "https://github.com/organizations/{{ config.organization }}/settings/apps/new" }
instance: "{{ config.organization }}"

config:
  - key: api_url
    label: API URL
    type: url
    required: true
    default: https://api.github.com
    help: https://api.github.com; https://api.<subdomain>.ghe.com with data residency; https://<host>/api/v3 for GitHub Enterprise Server.
  - { key: organization, label: Organization, type: string, required: true, placeholder: example-org, pattern: "[A-Za-z0-9-]+" }
  - key: auth_method
    label: Sign in with
    type: select
    required: true
    default: app
    options:
      - { value: app, label: GitHub App }
      - { value: token, label: Personal access token }
  - { key: app_id, label: App ID, type: string, pattern: "[0-9]+|Iv[0-9A-Za-z.]+", help: "GitHub App: the App ID or its client id." }
  - { key: installation_id, label: Installation id, type: string, pattern: "[0-9]+", help: "GitHub App: the installation's id." }
  - { key: private_key, label: App private key, type: text, secret: true, placeholder: "-----BEGIN RSA PRIVATE KEY-----", help: "GitHub App: its private key (.pem)." }
  - { key: token, label: Personal access token, type: string, secret: true, help: "Personal access token: an organization owner's, with read:audit_log, read:org and security_events." }
  - { key: enterprise, label: Enterprise, type: string, placeholder: example-enterprise, help: "The enterprise's slug, for its audit log." }
  - { key: enterprise_token, label: Enterprise owner token, type: string, secret: true, help: "A classic token with read:audit_log, for the enterprise audit log." }

auth:
  kind: choice
  field: auth_method
  options:
    # A GitHub App: an RS256 JWT (at most 10 minutes) exchanged for an hour-long installation token.
    app:
      kind: token_exchange
      jwt:
        private_key: "{{ secrets.private_key }}"
        claims: { iss: "{{ config.app_id }}" }
        lifetime: 9m
      request:
        method: POST
        url: "{{ config.api_url }}/app/installations/{{ config.installation_id }}/access_tokens"
        headers: { Authorization: "Bearer {{ auth.jwt }}", Accept: application/vnd.github+json }
      capture: { token: "{{ response.token }}" }
      ttl: 50m
    token: { kind: bearer, token: "{{ secrets.token }}" }

headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"

# 5,000 requests an hour per installation (15,000 on Enterprise Cloud); audit log queries 1,750 an hour.
rate_limit: { requests_per_minute: 25 }

errors:
  - status: [401]
    kind: auth
    message: "GitHub refused the credentials ({{ response.message ?? 'bad credentials' }}): check the App ID, installation id and private key, or the token"
  - status: [403, 429]
    when: "{{ headers['x-ratelimit-remaining'] == '0' || (response.message ?? '') | contains('rate limit') }}"
    kind: throttled
    message: "Rate limited by GitHub (resets at {{ headers['x-ratelimit-reset'] ?? '?' }})"
  - status: [403]
    kind: access_denied
    message: "GitHub refused ({{ response.message ?? 'forbidden' }}): the app (or token) needs Administration read for the audit log and the alerts' read permissions"
  - status: [404]
    kind: access_denied
    message: "Not found ({{ response.message ?? 'not found' }}): the audit log needs GitHub Enterprise Cloud, the alerts GitHub Advanced Security or Dependabot turned on"

streams:
  - id: audit_log
    name: Organization audit log
    description: >-
      Every audit event of the organization as a log (source:github, service:github): evt.name is the action
      (repo.create, org.add_member, protected_branch.destroy, …), usr.name the actor, network.client.* the actor's IP
      and location; git events included.
    request:
      url: "{{ config.api_url }}/orgs/{{ config.organization }}/audit-log"
      query:
        phrase: "created:{{ window.start | rfc3339_s }}..{{ window.end | rfc3339_s }}"
        include: all
        order: asc
        per_page: 100
    pagination: { kind: link_header }
    max_pages: 30
    record_id: "{{ record._document_id }}"
    incremental: &audit { kind: time, record_time: "{{ record['@timestamp'] }}", order: oldest_first, lookback: 1d, overlap: 10m }
    output:
      logs: &audit_log
        service: github
        message: "{{ record.action }} by {{ record.actor ?? 'GitHub' }}{{ ' on ' + record.repo ?? '' }}"
        status: "{{ record.action in ['repo.access', 'protected_branch.destroy', 'org.remove_member', 'repo.destroy', 'org.disable_two_factor_requirement', 'secret_scanning.disable', 'business.disable_two_factor_requirement'] ? 'warn' : 'info' }}"
        date: "{{ record['@timestamp'] | rfc3339 }}"
        attributes: >-
          {{ record + {
               evt: {name: record.action, category: record.action | split('.') | first},
               usr: {name: record.actor, id: record.actor_id | str},
               network: {client: {ip: record.actor_ip, geoip: record.actor_location}}
             } }}

  - id: enterprise_audit_log
    name: Enterprise audit log
    description: >-
      Every audit event of the enterprise as a log (source:github, service:github), as above. Needs the enterprise
      slug and an enterprise owner's classic token with read:audit_log.
    default_enabled: false
    auth: { kind: bearer, token: "{{ secrets.enterprise_token }}" }
    request:
      url: "{{ config.api_url }}/enterprises/{{ config.enterprise }}/audit-log"
      query:
        phrase: "created:{{ window.start | rfc3339_s }}..{{ window.end | rfc3339_s }}"
        include: all
        order: asc
        per_page: 100
    pagination: { kind: link_header }
    max_pages: 30
    record_id: "{{ record._document_id }}"
    incremental: *audit
    output:
      logs: *audit_log

  - id: code_scanning_alerts
    name: Code scanning alerts
    description: >-
      The open code scanning alerts as gauges (github.code_scanning.alerts.open, 1 per alert), tagged repository,
      severity, rule and tool; summed, the open alerts.
    interval: 15m
    request:
      url: "{{ config.api_url }}/orgs/{{ config.organization }}/code-scanning/alerts"
      query: { state: open, per_page: 100 }
    pagination: { kind: link_header }
    max_pages: 50
    output:
      metrics:
        - name: github.code_scanning.alerts.open
          value: "1"
          description: 1 per open code scanning alert; summed, the open alerts.
          tags:
            repository: "{{ record.repository.full_name }}"
            alert_number: "{{ record.number | str }}"
            severity: "{{ record.rule.security_severity_level ?? record.rule.severity }}"
            rule: "{{ record.rule.id }}"
            tool: "{{ record.tool.name }}"

  - id: dependabot_alerts
    name: Dependabot alerts
    description: >-
      The open Dependabot alerts as gauges (github.dependabot.alerts.open, 1 per alert), tagged repository,
      severity, ecosystem and package.
    interval: 15m
    request:
      url: "{{ config.api_url }}/orgs/{{ config.organization }}/dependabot/alerts"
      query: { state: open, per_page: 100 }
    pagination: { kind: link_header }
    max_pages: 50
    output:
      metrics:
        - name: github.dependabot.alerts.open
          value: "1"
          description: 1 per open Dependabot alert; summed, the open alerts.
          tags:
            repository: "{{ record.repository.full_name }}"
            alert_number: "{{ record.number | str }}"
            severity: "{{ record.security_advisory.severity }}"
            ecosystem: "{{ record.dependency.package.ecosystem }}"
            package: "{{ record.dependency.package.name }}"
            scope: "{{ record.dependency.scope }}"

  - id: secret_scanning_alerts
    name: Secret scanning alerts
    description: >-
      The open secret scanning alerts as gauges (github.secret_scanning.alerts.open, 1 per alert), tagged repository
      and secret type; the secrets themselves are never read into a tag or a log.
    interval: 15m
    request:
      url: "{{ config.api_url }}/orgs/{{ config.organization }}/secret-scanning/alerts"
      query: { state: open, per_page: 100, hide_secret: "true" }
    pagination: { kind: link_header }
    max_pages: 50
    output:
      metrics:
        - name: github.secret_scanning.alerts.open
          value: "1"
          description: 1 per open secret scanning alert; summed, the open alerts.
          tags:
            repository: "{{ record.repository.full_name }}"
            alert_number: "{{ record.number | str }}"
            secret_type: "{{ record.secret_type }}"
            validity: "{{ record.validity }}"

test:
  request: { url: "{{ config.api_url }}/orgs/{{ config.organization }}/audit-log", query: { per_page: 1 } }
  message: "Connected: {{ config.auth_method == 'token' ? 'the token' : 'the app' }} reads {{ config.organization }}'s audit log"

# GitHub Enterprise Cloud streams its enterprise's audit log to Splunk: the intake's HEC-compatible endpoint takes it.
push:
  kind: splunk_hec
  instructions: |
    Instead of polling the enterprise audit log, GitHub Enterprise Cloud can stream it: an enterprise owner opens
    **Enterprise settings → Audit log → Log streaming → Configure stream → Splunk** and enters:

    - **Domain**: the intake's host name (`{{ intake }}` without `https://`)
    - **Port**: `443`
    - **Token**: the ingest API key followed by `:{{ source }}`, `{{ api_key }}:{{ source }}`
    - **Enable SSL verification**: on

    GitHub checks and sends to `<Domain>:<Port>/services/collector`, below. Its audit fields (action, actor, repo, …)
    are the logs' attributes, as the polled ones. The domain can't carry `?ddsource=` and GitHub sets no source of
    its own, so the token's `:{{ source }}` makes them `source:{{ source }}`, as the polled ones, and the GitHub
    pipeline and dashboard read them. Turn the **Enterprise audit log** stream off when streaming: one of the two is
    enough.
  url: "{{ intake }}/services/collector"

assets:
  dashboards: [assets/dashboards/overview.json]

