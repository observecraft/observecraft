# yaml-language-server: $schema=../connector.schema.json
# Fastly (https://www.fastly.com/documentation/reference/api/metrics-stats/historical-stats/): services' minute
# statistics from the historical stats API as the fastly.* metrics Datadog's Fastly integration publishes (requests,
# hits, misses, bandwidth, status codes, errors, origin fetches), tagged service. Datadog reads Fastly's real-time
# stats (a long poll per service); minute stats are the batch equivalent, final two to fifteen minutes after the
# minute. Logs come by Fastly's log streaming to an HTTPS endpoint (push below). Fastly checks an HTTPS endpoint's
# host first, by fetching /.well-known/fastly/logging/challenge from it: the intake doesn't serve that path yet
# (docs/connectors.md), so until it does Fastly refuses the endpoint. Datadog has no integrations-core tile for it,
# so the package adds its own tile and dashboard; metric names follow Datadog's list, not checked against its metadata.
schema_version: 1
id: fastly
name: Fastly
publisher: ObserveCraft
vendor: Fastly
description: >-
  Fastly services' requests, cache hits and misses, bandwidth, status codes, errors and origin fetches per minute
  as metrics, read from Fastly's historical stats API; request logs pushed by Fastly's HTTPS log streaming.
logo: fastly
categories: [Caching, Network, Log Collection]
docs_url: https://www.fastly.com/documentation/reference/api/metrics-stats/historical-stats/
setup: |
  1. In the Fastly control panel, open **Account → API tokens → Create Token**, e.g. `observecraft`, with the
     **global:read** scope (read-only) for all services or the ones to read. Copy it.
  2. Leave **Services** empty to read every service the token sees.
links:
  - { label: API tokens, url: "https://manage.fastly.com/account/personal/tokens" }
instance: "{{ config.account_name }}"

config:
  - { key: account_name, label: Account name, type: string, required: true, placeholder: example-shop, help: A name for the Fastly account (the metrics' fastly_account tag). }
  - { key: api_token, label: API token, type: string, secret: true, required: true, help: A global:read token. }
  - { key: service_ids, label: Services, type: list, pattern: "[0-9A-Za-z]{22}", help: Service ids (default every service). }

auth:
  kind: api_key
  name: Fastly-Key
  value: "{{ secrets.api_token }}"

rate_limit: { requests_per_minute: 60 }

errors:
  - status: [401]
    kind: auth
    message: Fastly refused the API token
  - status: [403]
    kind: access_denied
    message: "The token can't read this service's stats ({{ response.msg ?? 'forbidden' }}): give it global:read on the service"
  - status: [429]
    kind: throttled
    message: Rate limited by Fastly

tables:
  counts:
    requests: fastly.requests
    hits: fastly.hits
    miss: fastly.miss
    pass: fastly.pass
    synth: fastly.synth
    errors: fastly.errors
    bandwidth: fastly.bandwidth
    body_size: fastly.body_size
    header_size: fastly.header_size
    req_body_bytes: fastly.req_body_bytes
    req_header_bytes: fastly.req_header_bytes
    origin_fetches: fastly.origin_fetches
    shield: fastly.shield
    edge_requests: fastly.edge_requests
    status_1xx: fastly.status_1xx
    status_2xx: fastly.status_2xx
    status_3xx: fastly.status_3xx
    status_4xx: fastly.status_4xx
    status_5xx: fastly.status_5xx
    status_200: fastly.status_200
    status_204: fastly.status_204
    status_301: fastly.status_301
    status_302: fastly.status_302
    status_304: fastly.status_304
    status_400: fastly.status_400
    status_401: fastly.status_401
    status_403: fastly.status_403
    status_404: fastly.status_404
    status_429: fastly.status_429
    status_500: fastly.status_500
    status_502: fastly.status_502
    status_503: fastly.status_503
    status_504: fastly.status_504
    tls: fastly.tls
    http2: fastly.http2
    http3: fastly.http3
    ipv6: fastly.ipv6
    pci: fastly.pci
    restarts: fastly.restarts
    logging: fastly.logging
    log_bytes: fastly.log_bytes

discover:
  - name: services
    request: { url: "https://api.fastly.com/service", query: { per_page: 100 } }
    value: "{{ response | pluck('id') }}"
    ttl: 1h

streams:
  - id: stats
    name: Service statistics
    description: >-
      Each service's statistics per minute: fastly.requests, hits, miss, pass, errors, bandwidth, status_1xx…5xx and
      common status codes, origin_fetches, … as counts, and fastly.hit_ratio, fastly.hits_time and fastly.miss_time
      as gauges, tagged service and service_id.
    for_each: "{{ config.service_ids ?? discovery.services }}"
    interval: 5m
    lookups:
      - { name: services, request: { url: "https://api.fastly.com/service", query: { per_page: 100 } }, key: "{{ record.id }}", value: "{{ record.name }}", ttl: 1h }
    request:
      url: "https://api.fastly.com/stats/service/{{ item }}"
      query: { from: "{{ window.start | epoch_s }}", to: "{{ window.end | epoch_s }}", by: minute }
    records: "{{ response.data }}"
    record_id: "{{ record.start_time | str }}"
    incremental: { kind: time, record_time: "{{ record.start_time }}", order: oldest_first, lookback: 1h, settle: 5m, max_window: 6h }
    output:
      metrics:
        - name: "{{ tables.counts[entry.key] }}"
          type: count
          each: "{{ record }}"
          value: "{{ entry.value }}"
          time: "{{ record.start_time }}"
          tags: &svc { service: "{{ lookups.services[item] ?? item }}", service_id: "{{ item }}", fastly_account: "{{ config.account_name }}" }
        - { name: fastly.hit_ratio, value: "{{ record.hit_ratio }}", time: "{{ record.start_time }}", unit: fraction, description: Cache hits over cacheable requests., tags: *svc }
        - { name: fastly.hits_time, value: "{{ record.hits_time }}", time: "{{ record.start_time }}", unit: second, description: Time spent serving hits., tags: *svc }
        - { name: fastly.miss_time, value: "{{ record.miss_time }}", time: "{{ record.start_time }}", unit: second, description: Time spent serving misses., tags: *svc }

test:
  request: { url: "https://api.fastly.com/tokens/self" }
  message: "Connected: token {{ response.name }} with scope {{ response.scope }}"

push:
  kind: logs
  instructions: |
    Fastly streams request logs to an HTTPS endpoint. In the Fastly control panel, open the service's **Logging →
    Create endpoint → HTTPS**: **URL** `{{ intake }}/api/v2/logs?ddsource={{ source }}&service=fastly`, **Method**
    POST, **Content type** `application/json`, **JSON log entry format** newline delimited, a **Custom header**
    `DD-API-KEY` with the value below, and this **Log format**:

    ```
    {"timestamp":"%{begin:%Y-%m-%dT%H:%M:%S%z}t","message":"%m %U %>s","network":{"client":{"ip":"%h"}},"http":{"method":"%m","url":"%U","status_code":%>s,"useragent":"%{json.escape(req.http.User-Agent)}V","referer":"%{json.escape(req.http.Referer)}V"},"fastly":{"service_id":"%{req.service_id}V","pop":"%{server.datacenter}V","cache_status":"%{fastly_info.state}V","bytes_sent":%B,"duration_us":%{time.elapsed.usec}V}}
    ```

    Fastly first checks the host by fetching `/.well-known/fastly/logging/challenge` from it; ObserveCraft's intake
    doesn't answer that path yet, so the endpoint can't be activated until it does.
  url: "{{ intake }}/api/v2/logs?ddsource={{ source }}&service=fastly"
  headers: { DD-API-KEY: "{{ api_key }}" }

assets:
  dashboards: [assets/dashboards/overview.json]

mock:
  config: { account_name: example-shop }
  secrets: { api_token: fastly-test-token-0000000000 }
  now: "2026-11-10T12:00:00Z"
  responses:
    - { url: "https://api.fastly.com/service", body: [ { id: 5VqE6MOOy1QFJbgmCK41pY, name: storefront-cdn, type: vcl } ] }
    - { url: "https://api.fastly.com/stats/service/5VqE6MOOy1QFJbgmCK41pY", file: fixtures/stats.json }
    - { url: "https://api.fastly.com/tokens/self", body: { id: 5Yo3XXnrQpjc20u0ybrf2g, name: observecraft, scope: "global:read", services: [], expires_at: null } }
  expect:
    stats: { records: 2, metrics: 32, rerun: 0, golden: fixtures/stats.expected.json }
    test: { ok: true, message: "Connected: token observecraft with scope global:read" }
